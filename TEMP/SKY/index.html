<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Star Sports Player - Fixed</title>
    <meta name="referrer" content="no-referrer">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .shaka-video-container { 
            position: fixed; inset: 0; 
            background: #000; display: flex; 
            align-items: center; justify-content: center; 
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Custom Watermark Styling */
        .custom-watermark {
            position: absolute;
            z-index: 10;
            bottom: 20%;
            left: 5%;
            font-size: 12px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="shaka-video-container" id="player-container">
        <video id="video" autoplay muted playsinline></video>
        <div class="custom-watermark">©</div>
    </div>

    <script>
        const CONFIG = {
            streamUrl: "https://bks02.starhubgo.com/bpk-token/1aa@xpwq3cyyzcwlamxab0pvgmb1fa3tfmxaxnrbhmaa/bpk-tv/HubSports4HDnew/output/manifest.mpd",
            keyId: "9a29d4f3b6e540b3aa2f36927c01b6f4",
            key: "57b670b45b5cb453a9f48fa975b702c1"
        };

        async function initApp() {
            // Install built-in polyfills
            shaka.polyfill.installAll();

            // Check browser compatibility
            if (!shaka.Player.isBrowserSupported()) {
                console.error('Browser not supported!');
                return;
            }

            const video = document.getElementById('video');
            const container = document.getElementById('player-container');
            const player = new shaka.Player(video);

            // Configure UI
            const ui = new shaka.ui.Overlay(player, container, video);
            const controls = ui.getControls();
            
            ui.configure({
                'addBigPlayButton': true,
                'controlPanelElements': ["play_pause", "time_and_duration", "spacer", "mute", "volume", "quality", "fullscreen"],
                'seekBarColors': {
                    base: 'rgba(255, 255, 255, 0.3)',
                    buffered: 'rgba(255, 255, 255, 0.5)',
                    played: 'rgb(255, 0, 0)',
                }
            });

            // Player Configuration with DRM
            player.configure({
                drm: {
                    clearKeys: {
                        [CONFIG.keyId]: CONFIG.key
                    }
                },
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 15,
                    rebufferingGoal: 3
                }
            });

            // Error handling
            player.addEventListener('error', (event) => {
                console.error('Shaka Player Error:', event.detail);
            });

            try {
                await player.load(CONFIG.streamUrl);
                console.log('The video has now been loaded!');
            } catch (e) {
                console.error('Error loading stream:', e);
            }

            // Unmute on first user play interaction
            video.addEventListener('play', () => {
                video.muted = false;
            }, { once: true });
        }

        document.addEventListener('shaka-ui-loaded', initApp);
        document.addEventListener('DOMContentLoaded', () => {
            if (!window['shaka-ui-loaded']) {
                initApp();
            }
        });
    </script>
</body>
</html>
