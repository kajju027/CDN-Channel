<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Player</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .player-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

<div class="player-container" data-shaka-player>
  <video autoplay playsinline></video>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    console.error("Browser not supported");
    return;
  }

  const video = document.querySelector("video");
  const container = document.querySelector(".player-container");

  const player = new shaka.Player();
  await player.attach(video);

  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      "play_pause",
      "time_and_duration",
      "mute",
      "volume",
      "spacer",
      "quality",
      "fullscreen"
    ]
  });

  // ✅ YOUR ORIGINAL STREAM
  const streamUrl = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/88tcrziisd/out/v1/14a712da109749bc8160010644e21708/cenc.mpd";

  // ✅ YOUR DRM KEYS
  player.configure({
    drm: {
      clearKeys: {
        "72e996f31b04e633c00ec579c8fb39e9": "4b87096cb3e8e359097aa6092fb1f455"
      }
    },

    streaming: {
      bufferingGoal: 60,
      rebufferingGoal: 20,
      bufferBehind: 30,
      lowLatencyMode: true
    }
  });

  // ✅ HEADERS (IMPORTANT FOR STREAM)
  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers["Referer"] = "https://live-pv-ta.amazon.fastly-edge.com/";
    request.headers["User-Agent"] = "Mozilla/5.0";
  });

  // ✅ ERROR HANDLING
  player.addEventListener("error", (e) => {
    console.error("Error:", e.detail);
  });

  try {
    await player.load(streamUrl);
    console.log("Stream started");
  } catch (err) {
    console.error("Load failed:", err);
  }

});
</script>

</body>
</html>
