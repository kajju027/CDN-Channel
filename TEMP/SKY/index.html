<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Sports Player</title>
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.shaka-video-container{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
.custom-watermark{position:absolute;z-index:40;pointer-events:none;top:65%;left:6%;transform:translateY(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,0.12)}
@media(max-width:700px){.custom-watermark{font-size:9px;top:60%;left:16%}}
</style>
</head>
<body>
<div class="shaka-video-container" id="player-container">
<video id="video" autoplay muted playsinline preload="metadata"></video>
<div class="custom-watermark">Sayan Official ™</div>
</div>
<script>
(function(){
  const CONFIG={
    streamUrl:"https://dice-live-oc.akamaized.net/hdntl=exp=1776767523~acl=%2f*~id=54ab4108-7958-4a51-a1bf-ffb3e6835f9d~data=hdntl,aXA9MzguMTM3LjMzLjEyMiZleHA9MTc3NjY4MTE1MiZlaWQ9ODM3OTE3Jm9pZD0yMiZ0eXBlPVZPRCZ1aWQ9bnVsbCZjaWQ9bnVsbCZwdD1udWxs~hmac=465dbf8d31288a70457aa681805f89ac7f0b1b367cad62e411752d52ecbedad4/dash/live/2093749/219026-314033/manifest-d.mpd",
    keyId:"aefc2c8d1c8840f1b6981f856c9269ba",
    key:"cf8ea114c45b4d6596b2748258ab74d6"
  };

  document.addEventListener("DOMContentLoaded",async()=>{
    shaka.polyfill.installAll();
    if(!shaka.Player.isBrowserSupported()) return;

    const video=document.getElementById("video");
    const container=document.getElementById("player-container");

    const player=new shaka.Player();
    await player.attach(video);

    const ui=new shaka.ui.Overlay(player,container,video);
    ui.configure({
      addBigPlayButton: true,
      controlPanelElements: ["mute","play_pause","time_and_duration","spacer","quality","picture_in_picture","fullscreen"],
      seekBarColors: {base: "white", buffered: "red", played: "green"}
    });

    player.configure({
      drm:{
        clearKeys:{
          [CONFIG.keyId]: CONFIG.key
        }
      },
      manifest:{defaultPresentationDelay:5},
      streaming:{
        lowLatencyMode:true,
        bufferingGoal:10,
        rebufferingGoal:2,
        safeSeekOffset:5
      }
    });

    try{
      await player.load(CONFIG.streamUrl);
      video.play().catch(()=>{});
    }catch(e){}

    video.addEventListener("play",()=>{
      video.muted=false;
    });
  });
})();
</script>
</body>
</html>
