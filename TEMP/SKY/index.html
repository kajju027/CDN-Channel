<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      position: fixed;
      inset: 0;
    }

    .player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .shaka-controls-container {
      position: absolute !important;
      inset: 0 !important;
      z-index: 10 !important;
      pointer-events: none !important;
    }

    .shaka-controls-container > * {
      pointer-events: auto !important;
    }

    .shaka-bottom-controls,
    .shaka-top-controls {
      z-index: 11 !important;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    .shaka-context-menu,
    .shaka-settings-menu,
    .shaka-quality-selection,
    .shaka-caption-selection,
    .shaka-language-selection,
    .shaka-resolutions-menu {
      z-index: 100 !important;
      pointer-events: auto !important;
    }
  </style>
</head>

<body>
  <div class="player-container" id="player-container">
    <video autoplay playsinline preload="auto"></video>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error("Browser not supported");
        return;
      }

      const video = document.querySelector("video");
      const container = document.getElementById("player-container");

      const player = new shaka.Player();
      await player.attach(video);

      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          "mute",
          "play_pause",
          "time_and_duration",
          "spacer",
          "quality",
          "picture_in_picture",
          "fullscreen"
        ],
        seekBarColors: {
          base: "white",
          buffered: "red",
          played: "green"
        }
      });

      const streamUrl = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/pnu10tp36z/out/v1/912e9db56d75403b8a9ac0a719110f36/cenc.mpd";
      
      const combinedKey = "192b1115da041585c77200128549efa1:634e10efe4abbb14be400a3ccbac0258";
      const [keyId, key] = combinedKey.split(":");

      player.configure({
        drm: {
          clearKeys: {
            [keyId]: key
          }
        },
        manifest: {
          defaultPresentationDelay: 10,
          dash: {
            ignoreMinBufferTime: true,
            autoCorrectDrift: true
          }
        },
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 10,
          rebufferingGoal: 2,
          bufferBehind: 15,
          retryParameters: {
            timeout: 10000,
            maxAttempts: 5,
            baseDelay: 500,
            backoffFactor: 1.5
          },
          jumpLargeGaps: true
        },
        abr: {
          enabled: true,
          defaultBandwidthEstimate: 1000000,
          switchInterval: 1,
          bandwidthUpgradeTarget: 0.7,
          bandwidthDowngradeTarget: 0.5
        }
      });

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers["Referer"] = "https://live-pv-ta.amazon.fastly-edge.com/";
        request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13)";
      });

      player.addEventListener("error", (event) => {
        console.error("Player error:", event.detail);
      });

      try {
        await player.load(streamUrl);
        console.log("Stream Loaded Successfully.");
      } catch (err) {
        console.error(" Stream Load Failed:", err);
      }
    });
  </script>
</body>
</html>
