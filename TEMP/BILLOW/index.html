<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Player</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      position: fixed;
      inset: 0;
    }

    .player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* Shaka UI Controls */
    .shaka-controls-container {
      position: absolute !important;
      inset: 0 !important;
      z-index: 10 !important;
      pointer-events: none !important;
    }

    .shaka-controls-container > * {
      pointer-events: auto !important;
    }

    .shaka-bottom-controls,
    .shaka-top-controls {
      z-index: 11 !important;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* Ensure menus/overlays are clickable */
    .shaka-context-menu,
    .shaka-settings-menu,
    .shaka-quality-selection,
    .shaka-caption-selection,
    .shaka-language-selection,
    .shaka-resolutions-menu {
      z-index: 100 !important;
      pointer-events: auto !important;
    }
  </style>
</head>

<body>
  <div class="player-container" id="player-container">
    <video autoplay playsinline preload="auto"></video>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error("Browser not supported");
        return;
      }

      const video = document.querySelector("video");
      const container = document.getElementById("player-container");

      const player = new shaka.Player();
      await player.attach(video);

      // UI create করার আগে player ready আছে কিনা নিশ্চিত করো
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          "play_pause",
          "time_and_duration",
          "mute",
          "volume",
          "spacer",
          "language",
          "captions",
          "picture_in_picture",
          "quality",
          "fullscreen"
        ],
        volumeBarColors: {
          base: "rgba(63, 187, 1, 1)",
          level: "rgb(255, 69, 0)"
        },
        seekBarColors: {
          base: "rgb(41, 41, 163)",
          buffered: "rgb(35, 99, 3)",
          played: "rgba(63, 187, 1, 1)"
        }
      });

      const controls = ui.getControls();
      if (controls) {
        console.log("Controls ready:", controls);
      } else {
        console.warn("Controls not found");
      }

      const streamUrl = "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/fpspuirqoc/out/v1/a047840f50a84f47ba6d765d910ffc5b/cenc.mpd";
      player.configure({
        drm: {
          clearKeys: {
            "dedbf883004d1468d70fb008ff2430d0": "ac7928fcd566ddebdf2b63cb4d1daeb6"
          }
        },
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 60,
          rebufferingGoal: 20,
          bufferBehind: 30,
          retryParameters: {
            timeout: 15000,
            maxAttempts: 10,
            baseDelay: 500,
            backoffFactor: 1.5
          },
          segmentRequestTimeout: 15000,
          smallGapLimit: 0.5,
          jumpLargeGaps: true
        },
        manifest: {
          retryParameters: {
            timeout: 15000,
            maxAttempts: 10,
            backoffFactor: 1.5
          },
          dash: {
            ignoreMinBufferTime: true,
            autoCorrectDrift: true
          }
        },
        abr: {
          enabled: true,
          defaultBandwidthEstimate: 8000000,
          switchInterval: 2,
          bandwidthUpgradeTarget: 0.7,
          bandwidthDowngradeTarget: 0.5
        }
      });

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers["Referer"] = "https://live-pv-ta.amazon.fastly-edge.com/";
        request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13)";
      });

      player.addEventListener("error", (event) => {
        console.error("Player error:", event.detail);
      });

      try {
        await player.load(streamUrl);
        console.log("Stream loaded successfully");
      } catch (err) {
        console.error("Load failed:", err);
      }
    });
  </script>
</body>
</html>
