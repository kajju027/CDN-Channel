<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Willow // Sonu</title>
    <meta name="referrer" content="no-referrer">
    
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.0.9/dist/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.0.9/dist/controls.css"/>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; background: #000; 
            overflow: hidden; font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
        }
        .shaka-video-container { 
            position: fixed; inset: 0; background: #000; 
            display: flex; align-items: center; justify-content: center; 
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Full-screen blocking overlay for sandboxed/restricted frames */
        .block-overlay { 
            position: fixed; inset: 0; z-index: 9999; display: flex; 
            align-items: center; justify-content: center; background: #111; color: #fff; 
            text-align: center; font-size: 18px; padding: 20px;
        }
    </style>
</head>
<body>

    <div class="shaka-video-container" id="player-container">
        <video id="video" autoplay muted playsinline preload="metadata"></video>
    </div>

<script>
(function() {
    // Stream and DRM Configuration
    const CONFIG = {
        manifest: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/8kgmavmivc/out/v1/394cc62641f1452bb1f5919a9114a57a/cenc.mpd",
        clearKeys: {
            "1d6d9c164f50d0c058c38ea2574b55ab": "007b6b520787fcc78a6a56fd6a149df2"
        }
    };

    async function initPlayer() {
        const video = document.getElementById('video');
        const container = document.getElementById('player-container');
        
        // Install polyfills to ensure cross-browser compatibility
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            console.error('Browser not supported for Shaka Player.');
            return;
        }

        const player = new shaka.Player();
        await player.attach(video);

        // Configure UI with Shaka 5.x features
        const ui = new shaka.ui.Overlay(player, container, video);
        ui.configure({
            'controlPanelElements': [
                "play_pause", 
                "time_and_duration", 
                "spacer", 
                "quality", 
                "fullscreen"
            ],
            'addBigPlayButton': true,
            'doubleClickForFullscreen': true
        });

        // DRM and Network Performance Tuning
        player.configure({
            drm: { clearKeys: CONFIG.clearKeys },
            manifest: { defaultPresentationDelay: 5 },
            streaming: {
                lowLatencyMode: true,
                rebufferingGoal: 2,
                bufferingGoal: 10,
                alwaysStreamText: true
            }
        });

        // Unmute Logic: Unmutes video when the user clicks anywhere or starts playback
        const unmuteHandler = () => {
            if (video.muted) {
                video.muted = false;
                console.log("Audio unmuted via user interaction.");
            }
            // Remove listeners once audio is enabled
            window.removeEventListener('click', unmuteHandler);
            video.removeEventListener('play', unmuteHandler);
        };

        window.addEventListener('click', unmuteHandler);
        video.addEventListener('play', unmuteHandler);

        try {
            await player.load(CONFIG.manifest);
        } catch (e) {
            console.error('Playback failed to load:', e);
        }
    }

    // Basic Environment Check
    if (window.self !== window.top && !document.referrer.includes(window.location.host)) {
        document.body.innerHTML = '<div class="block-overlay"><div><h2>Access Restricted</h2><p>Please use a standard browser to view this content.</p></div></div>';
    } else {
        document.addEventListener('DOMContentLoaded', initPlayer);
    }
})();
</script>

</body>
</html>
