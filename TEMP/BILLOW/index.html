<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Willow // Sonu</title>
    <meta name="referrer" content="no-referrer">
    
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.0.9/dist/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.0.9/dist/controls.css"/>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; background: #000; 
            overflow: hidden; font-family: sans-serif; 
        }
        #player-container { 
            position: fixed; inset: 0; background: #000; 
            display: flex; align-items: center; justify-content: center; 
        }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="player-container">
        <video id="video" autoplay muted playsinline></video>
    </div>

<script>
async function initPlayer() {
    const video = document.getElementById('video');
    const container = document.getElementById('player-container');

    // Install polyfills
    shaka.polyfill.installAll();

    const player = new shaka.Player();
    await player.attach(video);

    // Basic UI Setup
    const ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
        'controlPanelElements': ["play_pause", "time_and_duration", "spacer", "quality", "fullscreen"],
        'addBigPlayButton': true
    });

    // Configuration
    player.configure({
        drm: {
            clearKeys: {
                "1d6d9c164f50d0c058c38ea2574b55ab": "007b6b520787fcc78a6a56fd6a149df2"
            }
        },
        streaming: {
            lowLatencyMode: true,
            rebufferingGoal: 2,
            bufferingGoal: 10
        }
    });

    // Simple Unmute Logic
    // Browsers require a click to play sound. This unmutes on the first click or play.
    const unmute = () => {
        video.muted = false;
        window.removeEventListener('click', unmute);
        video.removeEventListener('play', unmute);
    };
    window.addEventListener('click', unmute);
    video.addEventListener('play', unmute);

    try {
        await player.load("https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/8kgmavmivc/out/v1/394cc62641f1452bb1f5919a9114a57a/cenc.mpd");
    } catch (e) {
        console.error("Load failed", e);
    }
}

document.addEventListener('DOMContentLoaded', initPlayer);
</script>

</body>
</html>
