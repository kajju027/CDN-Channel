<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> $Sony LIV Events 2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
.shaka-video-container{position:absolute;inset:0}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}


.shaka-volume-bar-container,
.shaka-spinner-container{display:none!important}

.custom-watermark{
  position:absolute;
  top:60%;
  left:5%;
  font-size:13px;
  letter-spacing:1.5px;
  color:rgba(255,255,255,.35);
  opacity:0;
  pointer-events:none;
  transition:opacity 1.2s ease;
  z-index:3;
}
</style>
</head>

<body>
<div class="shaka-video-container">
  <video id="video" autoplay playsinline></video>

  <!-- Poster overlay -->
  <div id="poster-overlay"></div>

  <div class="custom-watermark" id="watermark">Sayan xyz</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', initApp);

const LOG={
  info:m=>console.log('%c[PLAYER]','color:#4caf50',m),
  warn:m=>console.warn('%c[PLAYER]','color:#ff9800',m),
  error:m=>console.error('%c[PLAYER]','color:#f44336',m)
};

const STREAM_URL = "https://jiotvpllive.cdn.jio.com/bpk-tv/SonyLIV_Sports_2_MOB/WDVLive/index.mpd";

const CLEAR_KEY_CONFIG = {
  drm:{
    clearKeys:{
      "ef24516ae38b50d18049343cd1cd998a":
      "eb4810ec250a1795a0019dba7881ff45"
    }
  }
};

async function initApp(){
  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){
    LOG.error('Browser not supported'); return;
  }

  const video = document.getElementById('video');
  const container = document.querySelector('.shaka-video-container');
  const watermark = document.getElementById('watermark');
  const posterOverlay = document.getElementById('poster-overlay');

  const player = new shaka.Player();
  await player.attach(video);

  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      'play_pause','mute','time_and_duration',
      'spacer','quality','overflow_menu','fullscreen'
    ],
    overflowMenuButtons: [
      'picture_in_picture','language','captions'
    ]
  });


  const colors=['#1a73e8','#00b020','#00e0f5','#9b00a6'];
  let idx = 0;
  function applySeek(){
    ui.configure({
      seekBarColors:{
        base:'rgba(255,255,255,.15)',
        played:colors[idx],
        buffered:colors[(idx+1)%colors.length]
      }
    });
  }
  applySeek();
  setInterval(()=>{idx=(idx+1)%colors.length; applySeek()}, 14400000);

  async function smartLoad(){
    try{
      player.configure({ drm:{} });
      await player.load(STREAM_URL);
      LOG.info('Cookie / default playback OK');
    }catch{
      try{
        player.configure(CLEAR_KEY_CONFIG);
        await player.load(STREAM_URL);
        LOG.info('ClearKey fallback OK');
      }catch{
        LOG.error('Playback failed');
      }
    }
  }

  await smartLoad();

  player.addEventListener('error', ()=>{});
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && video.paused){
      video.play().catch(()=>{});
    }
  });

  setTimeout(()=>watermark.style.opacity='0.4', 5000);

  video.addEventListener('loadeddata', ()=>{
    if(posterOverlay) posterOverlay.style.display='none';
  });
}

</script>

<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
