<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Sports 1 Hindi - Updated</title>
<meta name="referrer" content="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
.shaka-video-container{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
.shaka-volume-bar-container,.shaka-spinner-container{display:none!important}
.custom-watermark{position:absolute;z-index:40;pointer-events:none;top:65%;left:6%;transform:translateY(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,0.12)}
@media(max-width:700px){.custom-watermark{font-size:9px;top:60%;left:16%}}
</style>
</head>
<body>

<div class="shaka-video-container" id="player-container">
<video id="video" autoplay muted playsinline preload="metadata"></video>
<div class="custom-watermark">‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ Sayan Official ™</div>
</div>

<script>
const CONFIG={
streamUrl:"https://jiotvmblive.cdn.jio.com/bpk-tv/SonyLIV_Sports_1_MOB/WDVLive/index.mpd",
keyId:"4e4c5dba5bfe5a7c9338bc086eb80379",
key:"b8e8932f440084e1d2b705fa52eef94b",
cookie:"__hdnea__=st=1773540408~exp=1773626808~acl=/*~hmac=417553baefb49d6a3e9cb5f9a4e970fd92e4e95848b3be4b89d89e7db1cfacaa"
};

document.addEventListener("DOMContentLoaded",async()=>{

const video=document.getElementById("video");
const container=document.getElementById("player-container");

shaka.polyfill.installAll();
if(!shaka.Player.isBrowserSupported()) return;

const player=new shaka.Player();
await player.attach(video);

const ui=new shaka.ui.Overlay(player,container,video);

ui.configure({
controlPanelElements:["play_pause","time_and_duration","spacer","quality","fullscreen"],
seekBarColors:{base:"#FFFFFF",buffered:"#DC143C",played:"#32CD32"}
});

player.configure({
drm:{clearKeys:{[CONFIG.keyId]:CONFIG.key}},
abr:{defaultBandwidthEstimate:10000,enabled:true,switchInterval:1},
manifest:{
defaultPresentationDelay:4,
dash:{ignoreSuggestedPresentationDelay:true,ignoreMinBufferTime:true,autoCorrectDrift:true}
},
streaming:{
bufferingGoal:8,
rebufferingGoal:2,
bufferBehind:10,
lowLatencyMode:true,
safeSeekOffset:4,
stallThreshold:1
}
});

player.getNetworkingEngine().registerRequestFilter((type,request)=>{
request.headers["User-Agent"]="plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
request.headers["Referer"]="https://www.jiotv.com/";
if(CONFIG.cookie){
request.headers["Cookie"]=CONFIG.cookie;
let cookieValue=CONFIG.cookie.startsWith("__hdnea__=")?CONFIG.cookie.substring(10):CONFIG.cookie;
if((type===shaka.net.NetworkingEngine.RequestType.MANIFEST||type===shaka.net.NetworkingEngine.RequestType.SEGMENT)&&!request.uris[0].includes("__hdnea__")){
const sep=request.uris[0].includes("?")?"&":"?";
request.uris[0]+=sep+"__hdnea__="+cookieValue;
}
}
});

try{
await player.load(CONFIG.streamUrl,-4);
video.play().catch(()=>{});
}catch(e){}

video.addEventListener("play",()=>{video.muted=false});

});
</script>

</body>
</html>
