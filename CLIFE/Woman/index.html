<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criclife Women</title>     
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    .shaka-video-container:fullscreen video {
      object-fit: fill !important;
    }
    .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg {
      display: none !important;
    }
    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.15); 
      font-size: 0.8em; 
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="shaka-video-container" data-shaka-player>
    <video autoplay playsinline id="video" poster="https://i.ibb.co/KcQj71sH/file-00000000afac71f8903ab2d34965a150.png"></video>
    <div id="watermark">Sayan xyz</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();

      const video = document.getElementById('video');
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          'play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen', 'overflow_menu'
        ],
        overflowMenuButtons: [
          'captions', 'language', 'picture_in_picture'
        ],
        volumeBarColors: {
          base: 'rgba(0, 136, 255, 0.3)',
          level: 'rgb(0, 136, 255)'
        },
        seekBarColors: {
          base: 'rgba(0, 136, 255, 0.3)',
          buffered: 'rgba(0, 136, 255, 0.6)',
          played: 'rgb(0, 136, 255)'
        }
      });

      player.configure({
        drm: {
          clearKeys: {
            "9dc5ddd99e3c723bf109a504da715dac": "d39d55e9ba386a86641ca9668abf2b0d"
          }
        },
        streaming: {
          lowLatencyMode: true,
          safeSeekOffset: 5,
          bufferingGoal: 30
        }
      });

      try {
        await player.load('https://neacdnpop3-edge02.aws.playco.com/live/eds/CricLife_Women_27112025/DASH/CricLife_Women_27112025.mpd');
        
        video.addEventListener('canplay', () => {
          const range = player.seekRange();
          if (range.end > 5) {
            video.currentTime = range.end - 5;
          }
          video.play().catch(() => {});
        }, { once: true });

      } catch (error) {
        console.error(error);
      }
    });
  </script>
</body>
</html>
