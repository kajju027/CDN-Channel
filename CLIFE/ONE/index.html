<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criclife </title>
  <meta name="referrer" content="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh; width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #video-container {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
    }
    video { 
      width: 100%; height: 100%; 
      object-fit: contain; 
    }
    .shaka-video-container:fullscreen video { 
      object-fit: fill !important; 
    }
    .shaka-spinner-container { display: none !important; }
    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.12); 
      font-size: 0.7em; 
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="shaka-video-container" id="video-container" data-shaka-player>
    <video autoplay playsinline id="main-video" poster="https://i.ibb.co/KcQj71sH/file-00000000afac71f8903ab2d34965a150.png"></video>
    <div id="watermark">Sayan xyz</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const video = document.getElementById('main-video');
      const container = document.getElementById('video-container');

      shaka.polyfill.installAll();
      const player = new shaka.Player();
      await player.attach(video);

      const ui = new shaka.ui.Overlay(player, container, video);
      
      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen', 'overflow_menu'],
        overflowMenuButtons: ['captions', 'language', 'picture_in_picture'],
        volumeBarColors: { base: 'rgba(0, 136, 255, 0.3)', level: 'rgb(0, 136, 255)' },
        seekBarColors: { base: 'rgba(0, 136, 255, 0.3)', buffered: 'rgba(0, 136, 255, 0.6)', played: 'rgb(0, 136, 255)' }
      });

      player.configure({
        drm: { 
          clearKeys: { "1e23e51b09a67b83813c17049870bcd4": "c3d6288e378b0dc55320fd0e6fd2e55f" } 
        },
        streaming: {
          lowLatencyMode: true,
          safeSeekOffset: 5,
          bufferingGoal: 30
        }
      });

      try {
        await player.load("https://ev-fast-mpd.starzplayarabia.com/live/eds/CricLife1/DASH/CricLife1.mpd");
        
        video.addEventListener('canplay', () => {
          const range = player.seekRange();
          if (range.end > 5) {
            video.currentTime = range.end - 5;
          }
        }, { once: true });

        const tracks = player.getVariantTracks();
        const track = tracks.find(t => t.height === 360) || tracks[0];
        player.selectVariantTrack(track, true);

      } catch (e) {
        console.error(e);
      }
    });
  </script>

<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
