<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criclife 1 - SAYAN STREAM</title>
  <meta name="referrer" content="no-referrer">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh; width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #video-container {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      background: #000;
    }

    /* ডিফল্ট মোড contain এবং ফুলস্ক্রিনে অটো ফিল */
    video { 
      width: 100%; height: 100%; 
      object-fit: contain; 
      transition: object-fit 0.3s ease-in-out; 
    }

    /* ফুলস্ক্রিন করলেই অটোমেটিক Stretch/Fill হবে */
    .shaka-video-container:fullscreen video,
    video:fullscreen, 
    video:-webkit-full-screen { 
      object-fit: fill !important; 
    }

    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.12); 
      font-size: 0.6em; 
      pointer-events: none;
      z-index: 2147483647;
      letter-spacing: 0.5px;
    }

    /* কাস্টম পোস্টার ডিজাইন */
    #custom-poster {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url(' ') no-repeat center center;
      background-size: cover;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-hint {
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 50%;
    }

    /* প্রিমিয়াম হোয়াইট ইউআই */
    .shaka-spinner-container { display: none !important; }
    .shaka-played-range { background: #ffffff !important; }
    .shaka-range-container input[type=range]::-webkit-slider-thumb { background: #ffffff !important; }
    .shaka-bottom-controls { padding: 0 15px 10px 15px; }
    .shaka-current-time, .shaka-duration { font-weight: 600; }
  </style>
</head>

<body>
  <div class="shaka-video-container" id="video-container">
    <video autoplay playsinline id="main-video" class="shaka-video"></video>
    <div id="watermark">Sayan xyz</div>
    <div id="custom-poster">
       <div class="play-hint"><span class="material-icons" style="font-size: 60px;">play_arrow</span></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      STREAM_URL: "https://ev-fast-mpd.starzplayarabia.com/live/eds/CricLife1/DASH/CricLife1.mpd",
      DRM_KEY_ID: "1e23e51b09a67b83813c17049870bcd4",
      DRM_KEY: "c3d6288e378b0dc55320fd0e6fd2e55f",
      DELAY_SECONDS: 0,
      DEFAULT_HEIGHT: 360
    };

    document.addEventListener('shaka-ui-loaded', async () => {
      const video = document.getElementById('main-video');
      const container = document.getElementById('video-container');
      const poster = document.getElementById('custom-poster');

      shaka.polyfill.installAll();
      const player = new shaka.Player();
      await player.attach(video);

      const ui = new shaka.ui.Overlay(player, container, video);
      
      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen'],
        seekBarColors: { 
          base: 'rgba(255,255,255,0.3)', 
          buffered: 'rgba(255,255,255,0.5)', 
          played: '#ffffff' 
        }
      });

      player.configure({
        drm: { clearKeys: { [CONFIG.DRM_KEY_ID]: CONFIG.DRM_KEY } },
        abr: { enabled: true },
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 15,
          rebufferingGoal: 2,
          safeSeekOffset: CONFIG.DELAY_SECONDS
        }
      });

      // পোস্টার ক্লিক করলে আনমিউট হয়ে প্লে হবে
      poster.addEventListener('click', () => {
        video.muted = false;
        video.play();
        poster.style.display = 'none';
        
        const range = player.seekRange();
        if (range && isFinite(range.end)) {
            video.currentTime = Math.max(range.start, range.end - CONFIG.DELAY_SECONDS);
        }
      });

      try {
        await player.load(CONFIG.STREAM_URL);
        
        const tracks = player.getVariantTracks();
        let track = tracks.find(t => t.height === CONFIG.DEFAULT_HEIGHT) || tracks[0];
        player.selectVariantTrack(track, true);

      } catch (e) {
        console.error("Load failed", e);
      }

      // টাইম কালার অ্যানিমেশন (আপনার আগের কোড থেকে রাখা হয়েছে)
      const colors = ['#FF5252','#FFEB3B','#4CAF50','#03A9F4','#E91E63','#00BCD4','#FFC107'];
      setInterval(() => {
        const c = colors[Math.floor(Math.random() * colors.length)];
        document.querySelectorAll('.shaka-current-time, .shaka-duration').forEach(e => e.style.color = c);
      }, 1200);
    });
  </script>
</body>
</html>
