<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prime TV • Sayan 2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
    .shaka-video-container{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .shaka-volume-bar-container, .shaka-spinner-container {display:none!important}
    .custom-watermark{position:absolute;z-index:40;pointer-events:none;top:65%;left:6%;transform:translateY(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,0.12)}
    @media(max-width:700px){.custom-watermark{font-size:9px;top:60%;left:16%}}
  </style>
</head>
<body>
  <div class="shaka-video-container" id="player-container">
    <video id="video" autoplay playsinline preload="metadata"></video>
    <div class="custom-watermark">Sayan Official ™</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const videoEl = document.getElementById('video');
      const container = document.getElementById('player-container');
      
      const streamUrl = "https://ev-fast-mpd.starzplayarabia.com/live/eds/CricLife_Women_27112025/DASH/CricLife_Women_27112025.mpd";
      
      const player = new shaka.Player();
      await player.attach(videoEl);

      const ui = new shaka.ui.Overlay(player, container, videoEl);
      
      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen'],
        seekBarColors: {
          base: 'white',
          buffered: 'red',
          played: 'green'
        }
      });

      player.configure({
        drm: {
          clearKeys: {
            '9dc5ddd99e3c723bf109a504da715dac': 'd39d55e9ba386a86641ca9668abf2b0d'
          }
        },
        manifest: {
          defaultPresentationDelay: 4,
          dash: {
            ignoreMinBufferTime: true
          }
        },
        streaming: {
          bufferingGoal: 30,
          rebufferingGoal: 2,
          bufferBehind: 10,
          stallThreshold: 1,
          lowLatencyMode: false
        },
        abr: {
          enabled: true,
          defaultBandwidthEstimate: 1000000
        }
      });

      try {
        await player.load(streamUrl);
      } catch (e) {
        if (e.code !== 20) {
            console.error("Load failed");
        }
      }
    });
  </script>

<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
