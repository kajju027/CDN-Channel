<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Willow CB By Sayan</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    .shaka-video-container { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .shaka-volume-bar-container { display: none !important; }
    .custom-watermark { position: absolute; z-index: 40; pointer-events: none; top: 65%; left: 6%; transform: translateY(-50%); font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.22); }
    @media (max-width: 700px) { .custom-watermark { font-size: 9px; top: 60%; left: 16%; } }
    .shaka-spinner-container { display: flex !important; } 
  </style>
</head>
<body>
  <div class="shaka-video-container" id="player-container">
    <video id="video" poster="https://i.ibb.co/d0yXW75V/108693714.jpg" autoplay playsinline></video>
    <div class="custom-watermark">‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎    Sayan Official ™</div>
  </div>
  <script>
    const DATA_URL = "https://raw.githubusercontent.com/Cricketstan/Allrounder-/refs/heads/main/willow.html";

    async function initPlayer() {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const video = document.getElementById('video');
      const container = document.getElementById('player-container');
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: ['play_pause', 'mute', 'time_and_duration', 'spacer', 'quality', 'picture_in_picture', 'fullscreen'],
        seekBarColors: { base: 'rgba(255, 255, 255, 0.2)', buffered: 'rgba(255, 255, 255, 0.4)', played: '#007aff' }
      });

      try {
        const response = await fetch(DATA_URL);
        const textData = await response.text();

        const urlMatch = textData.match(/streamUrl\s*=\s*["']([^"']+)["']/);
        const streamUrl = urlMatch ? urlMatch[1].trim() : null;

        const keyMatch = textData.match(/["']([a-fA-F0-9]{32})["']\s*:\s*["']([a-fA-F0-9]{32})["']/);
        let clearKeys = {};
        if (keyMatch) {
            clearKeys[keyMatch[1]] = keyMatch[2];
        }

        if (!streamUrl) return;

        player.configure({
          drm: { clearKeys: clearKeys },
          streaming: {
            rebufferingGoal: 2,
            bufferingGoal: 5,
            lowLatencyMode: true,
            inaccurateManifestTolerance: 0,
            ignoreDeviceMaxResolution: true
          },
          abr: {
            enabled: true,
            initialBitrate: 400000, 
            switchInterval: 2
          }
        });

        await player.load(streamUrl);
      } catch (e) {
        console.error(e);
      }
    }
    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
