<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <title>WILLOW - SAYAN UPDATED</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    #video-container { width: 100%; height: 100%; position: relative; }
    video { width: 100%; height: 100%; background: #000; }
    
    /* Overlay image styling */
    #overlay-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 5;
    }
    
    .shaka-controls-container { z-index: 10 !important; }
  </style>
</head>
<body>

  <div id="video-container" data-shaka-player-container>
    <video id="video" class="shaka-video" poster="https://i.ibb.co/hJHFC5QQ/poster-20241003-234951.jpg" autoplay muted playsinline></video>
    <img id="overlay-image" src="https://i.ibb.co/hJHFC5QQ/poster-20241003-234951.jpg" alt="Thumbnail">
  </div>  

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const manifestUri = 'https://a170aivottlinear-a.akamaihd.net:443/OTTB/bom-nitro/live/dash/enc/f60kqesunw/out/v1/a435ed7a00f947deb4369b46d8f2fb70/cenc.mpd';
      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const overlayImage = document.getElementById('overlay-image');

      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);

      // প্লেয়ার কনফিগারেশন
      player.configure({
        drm: {
          clearKeys: {
            '1779C27B9D077A3BA0C9CC1BB9A94B9F': 'CC5CF3B7928FB9E0A1EE6A8B566F0A8E'
          }
        },
        streaming: {
          // ১০ মিনিট (৬০০ সেকেন্ড) ডিলে রাখার চেষ্টা করবে
          safeSeekOffset: 10, 
          lowLatencyMode: false,
        }
      });

      ui.configure({
        controlPanelElements: [
          'play_pause', 'spacer', 'time_and_duration', 'mute', 'volume', 'quality', 'fullscreen'
        ]
      });

      // আনমিউট পলিসি: ইউজার প্রথমবার ক্লিক করলেই সাউন্ড চালু হবে
      const enableSound = () => {
        video.muted = false;
        console.log("Audio Unmuted");
        window.removeEventListener('click', enableSound);
      };
      window.addEventListener('click', enableSound);

      try {
        await player.load(manifestUri);
        
        // ১০ মিনিট ডিলে সেট করা (লাইভ এজ থেকে ৬০০ সেকেন্ড পেছনে)
        const seekRange = player.seekRange();
        video.currentTime = seekRange.end - 600;

        console.log('Video Loaded with 10 min delay');
      } catch (e) {
        console.error('Error loading video', e);
      }

      // ভিডিও প্লে হওয়া শুরু করলে পোস্টার ইমেজ সরিয়ে ফেলা
      video.addEventListener('playing', () => {
        if(overlayImage) overlayImage.style.display = 'none';
      });
    });
  </script>
</body>
</html>
