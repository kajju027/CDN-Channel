<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cric Tv Live</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
    }
  </style>
</head>
    
<body>
  <div class="shaka-video-container" data-shaka-player>
    <video autoplay playsinline preload="metadata"></video>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const urlParams = new URLSearchParams(window.location.search);
      const channelId = urlParams.get('id');
      if (!channelId) return;

      let streamUrl = "";
      let drmConfig = { clearKeys: {} };
      let cookieHeader = "";

      // Fetch Channel Data & Cookie concurrently for speed
      try {
        const [chanRes, cookRes] = await Promise.all([
          fetch('https://allrounderid.pages.dev/api/jiotv2.json'),
          fetch('https://raw.githubusercontent.com/24sports-net/cookie-updater/refs/heads/main/cookie.json')
        ]);

        const channels = await chanRes.json();
        const cookieData = await cookRes.json();
        
        const channelData = channels.find(c => c.channel_id === channelId);
        if (channelData) {
          streamUrl = channelData.channel_url.split('?')[0]; 
          drmConfig.clearKeys[channelData.keyId] = channelData.key;
          cookieHeader = cookieData.cookieHeader;
        }
      } catch (e) { console.error("Data fetch error"); }

      const video = document.querySelector('video');
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: ['play_pause','time_and_duration','spacer','language','captions','quality','fullscreen'],
      });

      // Crucial optimization for instant start with 5s delay
      player.configure({
        drm: drmConfig,
        streaming: {
          // এটি প্লেয়ারকে শুরুতেই ৫ সেকেন্ড পিছিয়ে লোড করতে বাধ্য করবে
          safeSeekOffset: 5, 
          bufferingGoal: 6,
          rebufferingGoal: 2,
          alwaysStreamText: true,
          lowLatencyMode: true
        }
      });

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        
        if (cookieHeader) {
          request.headers['Cookie'] = cookieHeader;
          if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT) && !request.uris[0].includes('__hdnea__=')) {
            const sep = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += sep + cookieHeader;
          }
        }
      });

      try {
        // load() কল করার সময় Shaka নিজে থেকেই safeSeekOffset অনুযায়ী ৫ সেকেন্ড পিছিয়ে স্টার্ট করবে
        await player.load(streamUrl);
        video.play();
      } catch (e) {}
    });
  </script>
</body>
</html>
