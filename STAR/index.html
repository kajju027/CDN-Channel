<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cric Tv Live</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
    }
    #error-message {
      color: white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      text-align: center;
      display: none;
      z-index: 999;
    }
  </style>
</head>
    
<body>
  <div class="shaka-video-container" data-shaka-player>
    <video autoplay playsinline preload="metadata"></video>
    <div id="error-message"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const errorDiv = document.getElementById('error-message');
      const urlParams = new URLSearchParams(window.location.search);
      const channelId = urlParams.get('id');

      if (!channelId) {
        errorDiv.innerText = "Please provide a Channel ID (e.g., ?id=204)";
        errorDiv.style.display = "block";
        return;
      }

      let streamUrl = "";
      let drmConfig = { clearKeys: {} };
      let cookieHeader = "";

      // Fetch Channel Data
      try {
        const chanResponse = await fetch('https://allrounderid.pages.dev/api/jiotv2.json');
        const channels = await chanResponse.json();
        const channelData = channels.find(c => c.channel_id === channelId);

        if (channelData) {
          streamUrl = channelData.channel_url.split('?')[0]; 
          drmConfig.clearKeys[channelData.keyId] = channelData.key;
          document.title = channelData.channel_name;
        } else {
          errorDiv.innerText = "Channel not found!";
          errorDiv.style.display = "block";
          return;
        }
      } catch (e) {
        errorDiv.innerText = "API Error!";
        errorDiv.style.display = "block";
      }

      // Fetch Cookie
      try {
        const cookieRes = await fetch('https://raw.githubusercontent.com/24sports-net/cookie-updater/refs/heads/main/cookie.json');
        const cookieData = await cookieRes.json();
        cookieHeader = cookieData.cookieHeader;
      } catch (e) {}

      const video = document.querySelector('video');
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: ['play_pause','time_and_duration','spacer','language','captions','picture_in_picture','quality','fullscreen'],
        seekBarColors: { base: 'white', buffered: 'red', played: 'green' }
      });

      // Player Fast Loading & Buffering Configuration
      player.configure({
        drm: drmConfig,
        streaming: {
          bufferingGoal: 10, // ১০ সেকেন্ড বাফার লক্ষ্য (দ্রুত লোড হবে)
          rebufferingGoal: 2,
          bufferBehind: 10
        }
      });

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        
        if (cookieHeader) {
          request.headers['Cookie'] = cookieHeader;
          if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT) && !request.uris[0].includes('__hdnea__=')) {
            const sep = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += sep + cookieHeader;
          }
        }
      });

      try {
        await player.load(streamUrl);
        
        // ৫ সেকেন্ড পিছিয়ে দেওয়া (Delay System)
        const seekRange = player.seekRange();
        const startPos = seekRange.end - 5; // ৫ সেকেন্ড মাইনাস
        video.currentTime = startPos;
        
        video.play();
      } catch (e) {
        errorDiv.innerText = "Stream Offline!";
        errorDiv.style.display = "block";
      }
    });
  </script>
</body>
</html>
