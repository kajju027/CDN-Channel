<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HUB Sports By Dillzy</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" />

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:sans-serif; }
    .shaka-video-container { position:absolute; inset:0; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; }
    video { width:100%; height:100%; object-fit:contain; }
    .shaka-volume-bar-container { display:none !important; }
    .custom-watermark { position:absolute; z-index:40; pointer-events:none; top:65%; left:6%; transform:translateY(-50%); font-size:11px; font-weight:600; color:rgba(255,255,255,0.22); }
    @media (max-width:700px){ .custom-watermark{font-size:9px; top:60%; left:16%;} }
    .shaka-spinner-container{display:none!important;}
  </style>
</head>

<body>

<div class="shaka-video-container" id="player-container">
  <video id="video" autoplay playsinline></video>
  <div class="custom-watermark"> </div>
</div>
  
  <script src="https://pl28679821.effectivegatecpm.com/28/3a/6b/283a6bd2372457369ede7af192078f2f.js"></script>
<script>
const jsonUrl = "https://psplay.online/icctv/hub.php?id=hub4";

document.addEventListener('DOMContentLoaded', async () => {
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) return;

  const video = document.getElementById('video');
  const container = document.getElementById('player-container');
  const player = new shaka.Player();
  await player.attach(video);

  const ui = new shaka.ui.Overlay(player, container, video);
  ui.configure({
    controlPanelElements: ['play_pause','mute','time_and_duration','spacer','quality','picture_in_picture','fullscreen'],
    seekBarColors: { base:'white', buffered:'red', played:'green' }
  });

  try {
    //  Fetch JSON
    const res = await fetch(jsonUrl);
    const data = await res.json();

    const manifestUrl = data.Manifest_url;
    const keyPair = data.keys.split(":");
    const keyId = keyPair[0];
    const key = keyPair[1];

    player.configure({
      drm: { clearKeys: { [keyId]: key } },
      streaming:{
        lowLatencyMode:true,
        rebufferingGoal:0.5,
        bufferingGoal:4,
        segmentPrefetchLimit:1,
        ignoreDeviceMaxResolution:true,
        autoCorrectDrift:true
      },
      manifest:{
        dash:{
          autoCorrectDrift:true,
          clockSyncUri:"https://time.akamai.com/?iso"
        }
      }
    });

    await player.load(manifestUrl);
    const liveEdge = player.seekRange().end;
    video.currentTime = liveEdge - 1;

  } catch (e) {
    console.error("JSON / Player error:", e);
  }
});
</script>


<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
