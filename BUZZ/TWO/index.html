<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>     
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }
    .shaka-spinner-container {
      display: none !important;
    }
    #custom-play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s;
    }
    #custom-play-overlay svg {
      width: 60px;
      height: 60px;
      fill: white;
    }

    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.15); 
      font-size: 0.8em; 
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="shaka-video-container" data-shaka-player id="video-container">
    <div id="custom-play-overlay">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <video playsinline id="video" poster=" "></video>
    <div id="watermark">Sayan xyz</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const playOverlay = document.getElementById('custom-play-overlay');
      
      const player = new shaka.Player();
      await player.attach(video);

      const ui = new shaka.ui.Overlay(player, container, video);
      
      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen', 'overflow_menu'],
        overflowMenuButtons: ['captions', 'language', 'picture_in_picture']
      });

      player.configure({
        drm: {
          clearKeys: {
            "4e8b5ddac5332a4e66c002b4c0f22322": "d06de29b0eacb81ac6e3f325849047e8"
          }
        },
        streaming: {
          lowLatencyMode: true,
          jumpLargeGaps: true,
          rebufferingGoal: 2
        }
      });

      playOverlay.addEventListener('click', async () => {
        video.muted = false;
        try {
          await video.play();
          playOverlay.style.opacity = '0';
          setTimeout(() => playOverlay.style.display = 'none', 300);
        } catch (e) {
          console.error("Play Error:", e);
        }
      });

      try {
        await player.load('https://ev-fast-mpd.starzplayarabia.com/live/eds/Criclife_3/DASH/Criclife_3.mpd');
        video.muted = true;
      } catch (e) {
        console.error("Load Error:", e);
      }
    });
  </script>
</body>
</html>
