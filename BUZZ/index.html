<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>
  
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh; width: 100vw;
      overflow: hidden;
      font-family: sans-serif;
    }
    #video-container {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      background: #000;
    }

    /* ডিফল্ট মোড contain এবং ফুলস্ক্রিনে অটো ফিল লজিক */
    video { 
      width: 100%; height: 100%; 
      object-fit: contain; 
      transition: object-fit 0.3s ease; 
    }

    /* ফুলস্ক্রিন করলেই অটোমেটিক Stretch/Fill হবে */
    .shaka-video-container:fullscreen video,
    video:fullscreen, 
    video:-webkit-full-screen { 
      object-fit: fill !important; 
    }

    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.12); 
      font-size: 0.7em; 
      pointer-events: none;
      z-index: 2147483647;
      letter-spacing: 0.5px;
    }

    #custom-poster {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://i.ibb.co/5WZ2CNSf/1000029431.jpg') no-repeat center center;
      background-size: cover;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .play-hint {
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 50%;
    }

    /* প্রিমিয়াম হোয়াইট ইউআই ও ক্লিনার লুক */
    .shaka-spinner-container { display: none !important; }
    .shaka-played-range { background: #ffffff !important; }
    .shaka-range-container input[type=range]::-webkit-slider-thumb { background: #ffffff !important; }
    .shaka-bottom-controls { padding: 0 15px 10px 15px; }
  </style>
</head>
<body>

  <div id="video-container" class="shaka-video-container">
    <video id="video" class="shaka-video" autoplay muted playsinline></video>
    <div id="watermark">Sayan xyz</div>
    <div id="custom-poster">
       <div class="play-hint"><span class="material-icons" style="font-size: 60px;">play_arrow</span></div>
    </div>
  </div>  

  <script>
    const CONFIG = {
      MANIFEST: 'https://ev-fast-mpd.starzplayarabia.com/live/eds/CricLife2/DASH/CricLife2.mpd',
      KEY_ID: '48bef83b4c6a3c5189b01b0126210da4',
      KEY: 'bd085230b7b09e50954fe0af111a8a9f',
      DELAY: 0,
      QUALITY: 396
    };

    async function initApp() {
      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const poster = document.getElementById('custom-poster');

      shaka.polyfill.installAll();
      const player = new shaka.Player(); 
      await player.attach(video);

      const ui = new shaka.ui.Overlay(player, container, video);

      player.configure({
        drm: {
          clearKeys: { [CONFIG.KEY_ID.toLowerCase()]: CONFIG.KEY.toLowerCase() }
        },
        abr: { 
          enabled: true, 
          switchInterval: 1 
        },
        streaming: {
          safeSeekOffset: CONFIG.DELAY,
          bufferingGoal: 30,
          rebufferingGoal: 2
        }
      });

      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen'],
        seekBarColors: { 
          base: 'rgba(255,255,255,0.3)', 
          buffered: 'rgba(255,255,255,0.5)', 
          played: '#ffffff' 
        }
      });

      const applyDelay = () => {
        const range = player.seekRange();
        if (range.end > 0) {
            video.currentTime = Math.max(range.start, range.end - CONFIG.DELAY);
        }
      };

      poster.addEventListener('click', () => {
        video.muted = false;
        video.play();
        poster.style.display = 'none';
        applyDelay();
      });

      try {
        await player.load(CONFIG.MANIFEST);
        
        const tracks = player.getVariantTracks();
        const targetTrack = tracks.find(t => t.height === CONFIG.QUALITY) || tracks[0];
        player.selectVariantTrack(targetTrack, false);

        applyDelay();
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('shaka-ui-loaded', initApp);
  </script>
</body>
</html>
