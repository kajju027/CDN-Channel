<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT 4 Sports - SAYAN STREAM</title>
  
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh; width: 100vw;
      overflow: hidden;
      font-family: sans-serif;
    }
    #video-container {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.12); 
      font-size: 0.7em; 
      pointer-events: none;
      z-index: 2147483647;
      letter-spacing: 0.5px;
    }
    #custom-poster {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('') no-repeat center center;
      background-size: cover;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .play-hint {
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 50%;
    }
    .shaka-spinner-container { display: none !important; }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="video" class="shaka-video" autoplay muted playsinline></video>
    <div id="watermark">sayan xyz</div>
    <div id="custom-poster">
       <div class="play-hint"><span class="material-icons" style="font-size: 60px;">play_arrow</span></div>
    </div>
  </div>  

  <script>
    const CONFIG = {
      MANIFEST: 'https://ev-fast-mpd.starzplayarabia.com/live/eds/CricLife2/DASH/CricLife2.mpd',
      KEY_ID: '48bef83b4c6a3c5189b01b0126210da4',
      KEY: 'bd085230b7b09e50954fe0af111a8a9f',
      DELAY: 0,
      QUALITY: 396
    };
    async function initApp() {
      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const poster = document.getElementById('custom-poster');

      const player = new shaka.Player(); 
      await player.attach(video);

      const ui = new shaka.ui.Overlay(player, container, video);

      player.configure({
        drm: {
          clearKeys: { [CONFIG.KEY_ID.toLowerCase()]: CONFIG.KEY.toLowerCase() }
        },
        abr: { 
          enabled: true, // হাই কোয়ালিটি সাপোর্ট করার জন্য অটো বিটরেট অন করা জরুরি
          switchInterval: 1 // দ্রুত কোয়ালিটি সুইচ হবে
        },
        mediaSource: {
          forceTransmux: true
        },
        streaming: {
          safeSeekOffset: CONFIG.DELAY,
          bufferingGoal: 30, // ৩০ সেকেন্ডের ডাটা আগে থেকে লোড করবে
          rebufferingGoal: 2,
          bufferBehind: 30
        }
      });

      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen'],
        overflowMenuButtons: ['quality']
      });

      poster.addEventListener('click', () => {
        video.muted = false;
        video.play();
        poster.style.display = 'none';
        
        const range = player.seekRange();
        if (range.end > 0) {
            video.currentTime = range.end - CONFIG.DELAY;
        }
      });

      try {
        await player.load(CONFIG.MANIFEST);
        
        // শুরুতে ৩৯৬পি থেকে প্লে শুরু করার জন্য
        const tracks = player.getVariantTracks();
        const targetTrack = tracks.find(t => t.height === CONFIG.QUALITY) || tracks[0];
        player.selectVariantTrack(targetTrack, false); // Clear buffer false রাখা হয়েছে হাই কোয়ালিটির জন্য

        const range = player.seekRange();
        video.currentTime = range.end - CONFIG.DELAY;

      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('shaka-ui-loaded', initApp);
  </script>
</body>
</html>
