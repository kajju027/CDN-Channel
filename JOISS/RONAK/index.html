<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Star Sports 1 Hindi // Sayan 2026</title>
  <meta name="referrer" content="no-referrer">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" />

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif}

    .shaka-video-container{
      position:fixed;
      inset:0;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }

    .shaka-volume-bar-container,
    .shaka-spinner-container { display:none!important; }

    .custom-watermark{
      position:absolute;
      z-index:40;
      pointer-events:none;
      top:65%;
      left:6%;
      transform: translateY(-50%);
      font-size:11px;
      font-weight:600;
      color: rgba(255, 255, 255, 0.12);
    }

    #restriction-layer {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
    }

    .error-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .icon-lock {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: rgba(255, 77, 77, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff4d4d;
    }

    .error-box h1 {
      color: #ffffff;
      font-size: 24px;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .error-box p {
      color: #9ca3af;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .tg-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0088cc;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
    }

    .tg-btn:hover {
      background: #0099e6;
      transform: translateY(-2px);
    }

    .tg-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    @media(max-width:700px){
      .custom-watermark{ font-size:9px; top:60%; left:16%; }
    }
  </style>
</head>
<body>

  <div id="restriction-layer">
    <div class="error-box">
      <div class="icon-lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1>Access Restricted</h1>
      <p>This player is not authorized to operate on this domain. Please contact the official developer to obtain valid access permission.</p>
      <a href="https://t.me/TGRonak13" class="tg-btn">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.14-.26.26-.54.26l.195-2.822L15.4 9.42c.228-.202-.05-.314-.354-.112l-6.625 4.172-2.73-.853c-.594-.185-.605-.594.124-.878l10.654-4.105c.493-.18.925.115.779.877z"/></svg>
        Contact Developer
      </a>
    </div>
  </div>

  <div class="shaka-video-container" id="player-container">
    <video id="video" autoplay playsinline preload="metadata"></video>
    <div class="custom-watermark">‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ ‎ Sayan Official ™</div>
  </div>

<script>
const CONFIG = {
  streamUrl: "https://jiotvbpkmob.cdn.jio.com/bpk-tv/Sports18_1_SD_BTS/output/index.mpd?",
  keyId: "a3ed8dc0e0cb5d238da80ee0a85bd2e1",
  key: "67a96992e6406606f3480ab58d7f540c",
  cookieSource: "https://raw.githubusercontent.com/24sports-net/cookie-updater/refs/heads/main/cookie.json",
  allowedDomains: [
    "all-in-one-channel.pages.dev",
    "cnptv.pages.dev",
    "innings.pages.dev",
    "all-in-one-channel-888.vercel.app"
  ]
};

let activeCookie = "";

/* ===============================
   ENVIRONMENT CHECK
================================= */
function isLocalEnvironment() {
  const host = window.location.hostname;
  const protocol = window.location.protocol;

  return (
    host === "localhost" ||
    host === "127.0.0.1" ||
    protocol === "file:"
  );
}

/* ===============================
   STRICT DOMAIN VALIDATION
================================= */
function isDomainAllowed() {

  if (isLocalEnvironment()) return true;

  const currentHost = window.location.hostname;

  if (!CONFIG.allowedDomains.includes(currentHost)) {
    return false;
  }

  // Iframe protection (Production only)
  if (window.self !== window.top) {
    try {
      const parentHost = new URL(document.referrer).hostname;
      if (!CONFIG.allowedDomains.includes(parentHost)) {
        return false;
      }
    } catch {
      return false;
    }
  }

  return true;
}

/* ===============================
   COOKIE FETCH SYSTEM
================================= */
async function fetchCookie() {
  try {
    const res = await fetch(CONFIG.cookieSource, { cache: "no-store" });
    const data = await res.json();
    activeCookie = data.cookieHeader || "";
  } catch {
    activeCookie = "";
  }
}

/* ===============================
   INITIAL LOAD
================================= */
document.addEventListener("DOMContentLoaded", async () => {

  const layer = document.getElementById("restriction-layer");
  const container = document.getElementById("player-container");
  const video = document.getElementById("video");

  /* 🔒 DOMAIN BLOCK */
  if (!isDomainAllowed()) {
    container.innerHTML = "";
    video.src = "";
    layer.style.display = "flex";
    return;
  }

  /* 🍪 FETCH COOKIE */
  await fetchCookie();

  /* 🎬 SHAKA INIT */
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    layer.style.display = "flex";
    return;
  }

  const player = new shaka.Player(video);
  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      "play_pause",
      "time_and_duration",
      "spacer",
      "quality",
      "fullscreen"
    ]
  });

  player.configure({
    drm: {
      clearKeys: {
        [CONFIG.keyId]: CONFIG.key
      }
    },
    manifest: {
      defaultPresentationDelay: 15,
      dash: { ignoreMinBufferTime: true }
    },
    streaming: {
      bufferingGoal: 30,
      rebufferingGoal: 10,
      safeSeekOffset: 10
    },
    abr: { enabled: true }
  });

  /* ===============================
     NETWORK INTERCEPT
  ================================= */
  player.getNetworkingEngine().registerRequestFilter((type, request) => {

    request.headers["Referer"] = "https://www.jiotv.com/";
    request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

    if (activeCookie) {
      request.headers["Cookie"] = activeCookie;

      if (
        (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
         type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
        !request.uris[0].includes("__hdnea__")
      ) {
        const sep = request.uris[0].includes("?") ? "&" : "?";
        request.uris[0] += sep + activeCookie;
      }
    }
  });

  /* 🎥 LOAD STREAM */
  try {
    await player.load(CONFIG.streamUrl);
    await video.play();
  } catch {
    layer.style.display = "flex";
  }

});
</script>
</body>
</html>
