<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAM PLAYER - SAYAN 333 </title>
  
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh; width: 100vw;
      overflow: hidden;
      font-family: sans-serif;
    }

    #video-container {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      background: #000;
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.12); 
      font-size: 0.7em; 
      pointer-events: none;
      z-index: 2147483647;
      letter-spacing: 0.5px;
    }

    #custom-poster {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('') no-repeat center center;
      background-size: cover;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-hint {
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 50%;
    }

    .shaka-spinner-container { display: none !important; }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="video" class="shaka-video" autoplay muted playsinline></video>
    <div id="watermark">sayan xyz</div>
    <div id="custom-poster">
       <div class="play-hint"><span class="material-icons" style="font-size: 60px;">play_arrow</span></div>
    </div>
  </div>  

  <script>
    const CONFIG = {
      MANIFEST: 'https://ottb.live.cf.ww.aiv-cdn.net/lhr-nitro/live/dash/enc/lsdasbvglv/out/v1/bb548a3626cd4708afbb94a58d71dce9/cenc.mpd',
      KEY_ID: 'a93c1cbfdccd23233bac13540c693e7f',
      KEY: '2f6ab2e6693eb847eff3c9da8f9d01fc',
      DELAY: 10,
      QUALITY: 396
    };

    async function initApp() {
      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const poster = document.getElementById('custom-poster');

      const player = new shaka.Player(); 
      await player.attach(video);

      const ui = new shaka.ui.Overlay(player, container, video);

      player.configure({
        drm: {
          clearKeys: { [CONFIG.KEY_ID.toLowerCase()]: CONFIG.KEY.toLowerCase() }
        },
        abr: { enabled: false },
        mediaSource: {
          forceTransmux: true
        },
        streaming: {
          safeSeekOffset: CONFIG.DELAY
        }
      });

      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen'],
        addLanguageControls: false,
        addSettingsMenus: ['quality']
      });

      poster.addEventListener('click', () => {
        video.muted = false;
        video.play();
        poster.style.display = 'none';
        
        const range = player.seekRange();
        if (range.end > 0) {
            video.currentTime = range.end - CONFIG.DELAY;
        }
      });

      try {
        await player.load(CONFIG.MANIFEST);
        
        const tracks = player.getVariantTracks();
        const targetTrack = tracks.find(t => t.height === CONFIG.QUALITY) || tracks[0];
        player.selectVariantTrack(targetTrack, true);

        const range = player.seekRange();
        video.currentTime = range.end - CONFIG.DELAY;

      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('shaka-ui-loaded', initApp);
  </script>

<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
