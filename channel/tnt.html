<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css" />
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.6.18/dist/shaka-player.compiled.js"></script>
  <script src="https://cdn.plyr.io/3.8.4/plyr.polyfilled.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div id="player-container">
    <video id="player" playsinline controls></video>
  </div>

  <script>
    (function () {
      'use strict';

      var MANIFEST_URL = 'https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/dev1hjwzh9/out/v1/a5f0ee7ad7b24906b14f43bebbbe4678/cenc.mpd';
      var CLEAR_KEY = 'cc91508324ce9dcaf425a43d58f1d9d4:643e5474d9edd87c7d9091c8c97994ca';

      var video = document.getElementById('player');
      var player = new Plyr(video, {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
        autoplay: false,
        muted: false,
        playsinline: true
      });

      var parts = CLEAR_KEY.split(':');
      var keyId = parts[0].trim().toLowerCase();
      var keyValue = parts[1].trim().toLowerCase();

      var clearKeys = {};
      clearKeys[keyId] = keyValue;

      var shakaPlayer = new shaka.Player();

      shakaPlayer.configure({
        drm: {
          clearKeys: clearKeys
        },
        manifest: {
          dash: {
            clockSyncUri: 'https://time.akamai.com/'
          }
        },
        streaming: {
          rebufferingGoal: 1,
          startAtSegmentBoundary: true
        }
      });

      shakaPlayer.addEventListener('error', function (event) {
        console.error('Shaka Player Error:', event.detail);
      });

      shaka.polyfill.installAll();

      if (shaka.Player.isBrowserSupported()) {
        shakaPlayer.attach(video).then(function () {
          return shakaPlayer.load(MANIFEST_URL);
        }).then(function () {
          console.log('Stream loaded successfully.');
          video.play().catch(function () {
            var resume = function () {
              video.play().catch(function () {});
              document.removeEventListener('click', resume);
            };
            document.addEventListener('click', resume);
          });
        }).catch(function (error) {
          console.error('Failed to load manifest:', error);
        });
      } else {
        console.error('Browser does not support Shaka Player.');
      }
    })();
  </script>
</body>
</html>
