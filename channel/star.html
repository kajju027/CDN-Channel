<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Sonu // Star Sports</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pc{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#wm{position:absolute;z-index:40;pointer-events:none;top:65%;left:6%;transform:translateY(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,0.12)}
@media(max-width:700px){#wm{font-size:9px;top:60%;left:16%}}
#overlay{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#overlay svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay p{color:#555;font-size:13px;letter-spacing:.5px}
#status{position:fixed;top:0;right:0;z-index:9997;padding:5px 10px;background:rgba(0,0,0,0.82);font-size:10px;letter-spacing:.04em;font-family:'Segoe UI',sans-serif;border-bottom-left-radius:6px;pointer-events:none;opacity:0;transition:opacity .4s ease;max-width:260px;text-align:right;line-height:1.5}
#status.show{opacity:1}
#status.ok{color:#4ade80}
#status.warn{color:#facc15}
#status.err{color:#f87171}
#fit-btn{position:absolute;z-index:50;bottom:78px;right:130px;width:22px;height:22px;background:transparent;border:none;cursor:pointer;padding:0;opacity:0;pointer-events:none;transition:opacity .3s ease;display:none}
#fit-btn.visible{opacity:.85;pointer-events:auto}
#fit-btn.visible:hover{opacity:1}
#fit-btn svg{width:100%;height:100%;display:block}
@media(max-width:700px){#fit-btn{bottom:72px;right:110px}}
</style>
</head>
<body>
<div id="overlay">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none">
<circle cx="20" cy="20" r="16" stroke="#222" stroke-width="4"/>
<path d="M20 4a16 16 0 0 1 16 16" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
</svg>
<p>Loading stream...</p>
</div>
<div id="status"></div>
<div id="pc">
<video id="v" autoplay muted playsinline preload="metadata"></video>
<div id="wm">Sayan Official &#8482;</div>
<button id="fit-btn" title="Toggle View Mode"></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";
var _IN_IFRAME=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
var _API=atob("aHR0cHM6Ly9zYXlhbi1qc29uLTMucGFnZXMuZGV2L0RhdGEvQ2hhbm5lbHMuanNvbg==");
var _SK="__tv_cache__";
var _TTL=4*60*1000;
var _stEl=document.getElementById("status");
var _stTimer=null;
function _status(msg,type,dur){
_stEl.textContent=msg;
_stEl.className="show "+(type||"ok");
if(_stTimer)clearTimeout(_stTimer);
if(dur!==0){
_stTimer=setTimeout(function(){
_stEl.className=_stEl.className.replace("show","").trim();
_stTimer=null;
},dur||4000);
}
}
function _gp(n){try{return new URLSearchParams(location.search).get(n)||"";}catch(e){return "";}}
function _now(){return Date.now();}
function _sc(k,v){try{sessionStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function _gc(k){try{var r=sessionStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function _cookieExp(c){
try{var m=c.match(/exp=(\d+)/);if(m&&m[1])return parseInt(m[1],10)*1000-60000;}catch(e){}
return 0;
}
function _isCookieValid(c){if(!c)return false;var e=_cookieExp(c);return e?_now()<e:true;}
async function _apiFetch(){
var r=await fetch(_API,{cache:"no-store",headers:{"Accept":"application/json"}});
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json();
}
async function _getData(chId){
var cached=_gc(_SK);
var stale=!cached||!cached.channels||(_now()-(cached.fetchedAt||0)>_TTL);
var data;
if(stale){
data=await _apiFetch();
_sc(_SK,Object.assign({},data,{fetchedAt:_now()}));
}else{
data=cached;
var ch=cached.channels.find(function(c){return c.id===chId;});
if(ch&&!_isCookieValid(ch.cookie)){
_status("Refreshing session...","warn",0);
data=await _apiFetch();
_sc(_SK,Object.assign({},data,{fetchedAt:_now()}));
}
}
return data.channels.find(function(c){return c.id===chId;})
|| data.channels.find(function(c){return c.id==="H1";})
|| data.channels[0];
}
function _hide(el){if(el)el.style.display="none";}
var _MODES=["contain","fill","cover"];
var _ICONS={
contain:'<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="6" width="18" height="12" rx="1" stroke="rgba(255,255,255,0.85)" stroke-width="1.7"/><rect x="6" y="9" width="12" height="6" rx=".5" fill="rgba(255,255,255,0.25)"/></svg>',
fill:'<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="1" stroke="rgba(255,255,255,0.85)" stroke-width="1.7"/><rect x="3" y="3" width="18" height="18" rx="1" fill="rgba(255,255,255,0.2)"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke="rgba(255,255,255,0.35)" stroke-width="1"/></svg>',
cover:'<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="1" stroke="rgba(255,255,255,0.85)" stroke-width="1.7"/><rect x="5" y="5" width="14" height="14" rx=".5" fill="rgba(255,255,255,0.25)"/><path d="M3 3l4 4M21 3l-4 4M3 21l4-4M21 21l-4-4" stroke="rgba(255,255,255,0.6)" stroke-width="1.4" stroke-linecap="round"/></svg>'
};
function _isFs(){
return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);
}
async function _init(){
shaka.polyfill.installAll();
if(!shaka.Player.isBrowserSupported()){
_status("Stream Not Supported on This Browser","err",0);
_hide(document.getElementById("overlay"));
return;
}
var chId=_gp("ch")||"H1";
var ch;
try{
ch=await _getData(chId);
}catch(e){
_status("Could Not Connect. Check Your Network.","err",0);
_hide(document.getElementById("overlay"));
return;
}
if(!ch){
_status("Stream not found.","err",0);
_hide(document.getElementById("overlay"));
return;
}
if(!_isCookieValid(ch.cookie)){
_status("Refreshing Cookie...","warn",0);
try{
var fresh=await _apiFetch();
_sc(_SK,Object.assign({},fresh,{fetchedAt:_now()}));
ch=fresh.channels.find(function(c){return c.id===chId;})||fresh.channels.find(function(c){return c.id==="H1";})||fresh.channels[0];
}catch(e){
_status("Cookie Expired. Try Again Later.","err",0);
_hide(document.getElementById("overlay"));
return;
}
}
var vid=document.getElementById("v");
var con=document.getElementById("pc");
var fitBtn=document.getElementById("fit-btn");
vid.muted=true;
var player=new shaka.Player();
await player.attach(vid);
var ui=new shaka.ui.Overlay(player,con,vid);
ui.configure({
controlPanelElements:["mute","play_pause","time_and_duration","spacer","quality","picture_in_picture","fullscreen"],
seekBarColors:{base:"#9c9a9a",buffered:"#c90000",played:"#00ab17"}
});
var ck=ch.cookie;
var urlCk=ck.startsWith("__hdnea__=")?ck.substring(10):ck;
player.configure({
drm:{clearKeys:{[ch.keyId]:ch.key}},
manifest:{defaultPresentationDelay:5,retryParameters:{maxAttempts:3,baseDelay:1000,backoffFactor:2,fuzzFactor:0.5}},
streaming:{lowLatencyMode:true,bufferingGoal:12,rebufferingGoal:2,safeSeekOffset:5,retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:2,fuzzFactor:0.5}}
});
player.getNetworkingEngine().registerRequestFilter(function(type,req){
req.headers["Referer"]="https://www.jiotv.com/";
req.headers["User-Agent"]="plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
req.headers["Cookie"]=ck;
var T=shaka.net.NetworkingEngine.RequestType;
if((type===T.MANIFEST||type===T.SEGMENT)&&!req.uris[0].includes("__hdnea__")){
req.uris[0]+=(req.uris[0].includes("?")?"&":"?")+"__hdnea__="+urlCk;
}
});
async function _refreshCookies(){
_status("Reconnecting...","warn",0);
try{
var fresh=await _apiFetch();
_sc(_SK,Object.assign({},fresh,{fetchedAt:_now()}));
var nch=fresh.channels.find(function(c){return c.id===chId;})||fresh.channels.find(function(c){return c.id==="H1";})||fresh.channels[0];
if(nch){
ck=nch.cookie;
urlCk=ck.startsWith("__hdnea__=")?ck.substring(10):ck;
player.configure({drm:{clearKeys:{[nch.keyId]:nch.key}}});
_status("Reconnected","ok",3000);
}
}catch(e){
_status("Stream Interrupted. Try Again Shortly.","err",0);
}
}
player.addEventListener("error",async function(ev){
var code=ev.detail&&ev.detail.code;
if(code===7000||code===7001||code===7002||code===1001||code===1002){
await _refreshCookies();
}
});
try{
await player.load(ch.url);
vid.play().catch(function(){});
_hide(document.getElementById("overlay"));
_status("Live \u25CF","ok",5000);
}catch(e){
_hide(document.getElementById("overlay"));
_status("Oops !! Cookie Expired , Please Refresh And Try Again.","err",0);
return;
}
vid.addEventListener("play",function(){vid.muted=false;});
var _stalledTimer=null;
vid.addEventListener("stalled",function(){
if(_stalledTimer)return;
_status("Buffering...","warn",0);
_stalledTimer=setTimeout(async function(){
_stalledTimer=null;
await _refreshCookies();
try{await player.load(ch.url);vid.play().catch(function(){});}catch(e){}
},9000);
});
vid.addEventListener("playing",function(){
if(_stalledTimer){clearTimeout(_stalledTimer);_stalledTimer=null;}
_status("Live \u25CF","ok",4000);
});
var _modeIdx=0;
function _applyMode(idx){
_modeIdx=idx;
var m=_MODES[idx];
vid.classList.remove("mode-fill","mode-cover");
if(m==="fill")vid.classList.add("mode-fill");
else if(m==="cover")vid.classList.add("mode-cover");
fitBtn.innerHTML=_ICONS[m];
fitBtn.title=m==="contain"?"Fit (click: Stretch)":m==="fill"?"Stretch (click: Zoom)":"Zoom (click: Fit)";
}
_applyMode(0);
fitBtn.style.display="block";
fitBtn.addEventListener("click",function(e){
e.stopPropagation();
if(!_isFs())return;
_applyMode((_modeIdx+1)%_MODES.length);
});
function _onFsChange(){if(!_isFs())_applyMode(0);}
document.addEventListener("fullscreenchange",_onFsChange);
document.addEventListener("webkitfullscreenchange",_onFsChange);
document.addEventListener("mozfullscreenchange",_onFsChange);
document.addEventListener("MSFullscreenChange",_onFsChange);
var _hideTimer=null;
function _showCtrl(){
fitBtn.classList.add("visible");
if(_hideTimer)clearTimeout(_hideTimer);
_hideTimer=setTimeout(function(){
fitBtn.classList.remove("visible");
_hideTimer=null;
},3000);
}
con.addEventListener("mousemove",_showCtrl);
con.addEventListener("touchstart",_showCtrl,{passive:true});
con.addEventListener("click",_showCtrl);
}
document.addEventListener("DOMContentLoaded",_init);
(function _shield(){
if(_IN_IFRAME)return;
var _block=function(e){e.preventDefault();e.stopPropagation();return false;};
document.addEventListener("contextmenu",_block,true);
document.addEventListener("selectstart",_block,true);
document.addEventListener("dragstart",_block,true);
document.addEventListener("copy",_block,true);
document.addEventListener("keydown",function(e){
if(
e.key==="F12"||
(e.ctrlKey&&e.shiftKey&&["I","J","C"].includes(e.key))||
(e.ctrlKey&&e.key==="U")||
(e.metaKey&&e.altKey&&["I","J"].includes(e.key))
){e.preventDefault();e.stopPropagation();return false;}
},true);
var _fsActive=false;
function _onFs(){_fsActive=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);}
document.addEventListener("fullscreenchange",_onFs);
document.addEventListener("webkitfullscreenchange",_onFs);
document.addEventListener("mozfullscreenchange",_onFs);
var _deny=function(){
document.body.innerHTML='<div style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.35);font-size:12px;font-family:sans-serif;letter-spacing:.15em">ACCESS DENIED</div>';
};
var _isMobile='ontouchstart' in window||navigator.maxTouchPoints>0;
if(!_isMobile){
var _dtOpen=false;
setInterval(function(){
if(_fsActive||_dtOpen)return;
var wh=window.outerHeight-window.innerHeight;
var ww=window.outerWidth-window.innerWidth;
if(wh>200||ww>200){_dtOpen=true;_deny();}
},1200);
}
try{
var _i=document.createElement('iframe');
_i.style.display='none';
document.head.appendChild(_i);
var _c=_i.contentWindow.console;
Object.keys(_c).forEach(function(m){
if(typeof _c[m]==='function'){
console[m]=function(){};
}
});
_i.remove();
}catch(e){}
})();
})();
</script>
</body>
</html>
