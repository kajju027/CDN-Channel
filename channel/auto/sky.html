<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Auto Play // Dillzy</title>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.shaka-video-container{position:relative;width:100%;height:100%;background:#000;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain;background:#000;will-change:transform;transform:translateZ(0);-webkit-transform:translateZ(0)}
.shaka-spinner-container,.shaka-spinner,.shaka-spinner-svg{display:none!important}
#error-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff4c4c;font-size:15px;text-align:center;z-index:100;display:none;background:rgba(0,0,0,0.9);padding:15px 20px;border-radius:8px;border:1px solid #ff4c4c;max-width:85%;line-height:1.5}
</style>
</head>
<body>

<div class="shaka-video-container" id="pc">
<video id="v" autoplay playsinline preload="metadata"></video>
<div id="error-msg">Loading stream...</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
shaka.polyfill.installAll();
if(!shaka.Player.isBrowserSupported()){
    const errDiv = document.getElementById('error-msg');
    errDiv.innerText = "Your browser is not supported.";
    errDiv.style.display = "block";
    return;
}

const video = document.getElementById('v');
const container = document.getElementById('pc');
const errorMsg = document.getElementById('error-msg');

const player = new shaka.Player(video);
const ui = new shaka.ui.Overlay(player, container, video);

ui.configure({
controlPanelElements: [
'play_pause',
'time_and_duration',
'spacer',
'quality',
'picture_in_picture',
'fullscreen',
'overflow_menu'
],
overflowMenuButtons: [
'language',
'captions'
],
seekBarColors: {
base: "#9c9a9a",
buffered: "#c90000",
played: "#00ab17"
}
});

async function fetchDynamicStreamData(targetUrl) {
    let htmlContent = null;
    try {
        const response = await fetch(targetUrl);
        if (response.ok) htmlContent = await response.text();
    } catch (e) {}

    if (!htmlContent) {
        try {
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`;
            const response = await fetch(proxyUrl);
            if (response.ok) htmlContent = await response.text();
        } catch (e) {}
    }

    if (!htmlContent) return null;

    const streamUrlMatch = htmlContent.match(/streamUrl\s*=\s*["']([^"']+)["']/);
    const clearKeysMatch = htmlContent.match(/clearKeys\s*:\s*(\{[^}]+\})/);

    if (streamUrlMatch && clearKeysMatch) {
        try {
            let rawKeys = clearKeysMatch[1].replace(/'/g, '"').trim();
            return {
                url: streamUrlMatch[1],
                keys: JSON.parse(rawKeys)
            };
        } catch (parseError) {}
    }
    return null;
}

const targetSource = "https://allrounder-live8.pages.dev/channel/hub5.html";
const extractedData = await fetchDynamicStreamData(targetSource);

if (extractedData) {
    player.configure({
        drm: {
            clearKeys: extractedData.keys
        },
        streaming: {
            lowLatencyMode: false,
            bufferingGoal: 15, 
            rebufferingGoal: 3, 
            bufferBehind: 30, 
            retryParameters: {
                timeout: 10000,
                maxAttempts: 5,
                baseDelay: 300,
                backoffFactor: 1.2
            },
            segmentRequestTimeout: 8000,
            useNativeHlsOnSafari: true,
            abr: {
                enabled: true,
                switchInterval: 8,
                bandwidthUpgradeTarget: 0.85,
                bandwidthDowngradeTarget: 0.95
            }
        },
        manifest: {
            retryParameters: {
                timeout: 8000,
                maxAttempts: 3
            }
        }
    });

    try {
        await player.load(extractedData.url);
        errorMsg.style.display = "none";
    } catch (error) {
        errorMsg.innerText = "Failed to play. Keys or URL may be invalid.";
        errorMsg.style.display = "block";
    }
} else {
    errorMsg.innerText = "Failed to fetch data. Proxy might be blocked.";
    errorMsg.style.display = "block";
}
});
</script>
</body>
</html>
