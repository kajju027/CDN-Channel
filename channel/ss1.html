<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Star Sports English // Sonu</title>
    <meta name="referrer" content="no-referrer">
    
    <!-- Shaka Player Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css"/>
    
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Player Container */
        .shaka-video-container {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Custom Watermark */
        .custom-watermark {
            position: absolute;
            z-index: 40;
            pointer-events: none;
            top: 65%;
            left: 6%;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.12);
        }

        /* Responsive Watermark Adjustment */
        @media (max-width: 700px) {
            .custom-watermark {
                font-size: 9px;
                top: 60%;
                left: 16%;
            }
        }
    </style>
</head>
<body>

    <div class="shaka-video-container" id="player-container">
      
        <video id="video" autoplay muted playsinline preload="metadata"></video>
        <div class="custom-watermark"> </div>
    </div>

    <script>
    (function() {
        // Stream Configuration
        const CONFIG = {
            streamUrl: "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_BTS/WDVLive/index.mpd",
            keyId: "965dc2ddb1d85138ad787999a7f30ca5",
            key: "859695076e67fe961836b564db6d689c",
            cookieUrl: "https://allrounderid2.pages.dev/api/star-1.json"
        };

        document.addEventListener("DOMContentLoaded", async () => {
            // Initialize Shaka Player polyfills
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                console.error("Error: Browser is not supported by Shaka Player.");
                return;
            }

            const video = document.getElementById("video");
            const container = document.getElementById("player-container");
            
          
            video.muted = true;

          
            const player = new shaka.Player();
            await player.attach(video);

          
            const ui = new shaka.ui.Overlay(player, container, video);
            
            ui.configure({
                controlPanelElements: [
                    "mute",
                    "play_pause",
                    "time_and_duration",
                    "spacer",
                    "quality",
                    "picture_in_picture",
                    "fullscreen"
                ],
                seekBarColors: {
                    base: "#a8a8a8",
                    buffered: "#fff200", 
                    played: "#00990a"
                }
            });

            // Configure Player Settings (DRM, Latency, Buffering)
            player.configure({
                drm: {
                    clearKeys: { [CONFIG.keyId]: CONFIG.key }
                },
                manifest: {
                    defaultPresentationDelay: 5
                },
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 10,
                    rebufferingGoal: 2,
                    safeSeekOffset: 5
                }
            });

            // Fetch Authentication Cookie
            let cookieValue = "";
            try {
                const response = await fetch(CONFIG.cookieUrl, { cache: "no-store" });
                const data = await response.json();
                cookieValue = data.cookie || "";
            } catch (error) {
                console.error("Failed to fetch stream cookie:", error);
            }

            // Apply Network Interceptors if cookie is present
            if (cookieValue) {
                player.getNetworkingEngine().registerRequestFilter((type, request) => {
                    // Inject required headers
                    request.headers["Referer"] = "https://www.jiotv.com/";
                    request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
                    request.headers["Cookie"] = cookieValue;

                    // Strip prefix if it exists for URL appending
                    let urlCookie = cookieValue.startsWith("__hdnea__=") 
                        ? cookieValue.substring(10) 
                        : cookieValue;

                    // Append cookie token to Manifest and Segment URLs if missing
                    if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
                         type === shaka.net.NetworkingEngine.RequestType.SEGMENT) && 
                        !request.uris[0].includes("__hdnea__")) {
                        
                        const separator = request.uris[0].includes("?") ? "&" : "?";
                        request.uris[0] += separator + "__hdnea__=" + urlCookie;
                    }
                });
            }

            // Load the Stream
            try {
                await player.load(CONFIG.streamUrl);
                video.play().catch(err => console.warn("Autoplay blocked by browser:", err));
            } catch (error) {
                console.error("Error loading video stream:", error);
            }

            video.addEventListener("play", () => {
                video.muted = false;
            });

        });
    })();
    </script>

</body>
</html>
