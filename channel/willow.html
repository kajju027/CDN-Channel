<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Sonu // Live Stream</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.shaka-video-container{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain;background:#000;will-change:transform}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
.shaka-spinner-container,.shaka-spinner,.shaka-spinner-svg{display:none!important}
.shaka-fit-btn{background:transparent!important;border:none!important;cursor:pointer!important;padding:0 10px!important;opacity:.85;display:flex;align-items:center;justify-content:center;height:100%;transition:opacity .15s}
.shaka-fit-btn:hover{opacity:1}
.shaka-fit-btn svg{width:18px;height:18px;display:block}
.shaka-controls-container button{color:#fff!important}
#custom-loader{position:absolute;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
#custom-loader.active{opacity:1;pointer-events:auto}
.custom-spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,0.1);border-top:4px solid #38bdf8;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="shaka-video-container" id="pc">
<video id="v" autoplay playsinline preload="metadata"></video>
<div id="custom-loader" class="active"><div class="custom-spinner"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
shaka.polyfill.installAll();
if(!shaka.Player.isBrowserSupported()) return;

const video = document.getElementById('v');
const container = document.getElementById('pc');
const loader = document.getElementById('custom-loader');

const player = new shaka.Player();
await player.attach(video);

const ui = new shaka.ui.Overlay(player, container, video);

ui.configure({
controlPanelElements: [
'play_pause',
'time_and_duration',
'spacer',
'quality',
'fullscreen',
'overflow_menu'
],
overflowMenuButtons: [
'language',
'captions',
'playback_rate',
'picture_in_picture'
],
seekBarColors: {
base: "rgba(209,213,219,0.3)",
buffered: "rgba(139,0,0,0.5)",
played: "#008000"
}
});

const STREAM_URL = "https://abkyrm4aaaaaaaamfyfksth3wr44v.ta.bia-cf.live.pv-cdn.net/pdx-nitro/live/clients/dash/enc/w4ezdyyny6/out/v1/2c82c2bf6e3e4b89a30ece7adf11089c/cenc.mpd";

const CLEAR_KEYS = {
"16ce164bd9025d4bebc09c4096938a95": "34e9d1984fdd50d0be65f9cc9bb82e93"
};

player.configure({
drm: {
clearKeys: CLEAR_KEYS
},
manifest: {
defaultPresentationDelay: 4,
ignoreTextStreamFailures: true
},
streaming: {
lowLatencyMode: true,
bufferingGoal: 12,
rebufferingGoal: 3,
safeSeekOffset: 4
},
abr: {
enabled: true,
defaultBandwidthEstimate: 1000000,
restrictions: { maxHeight: 1080 }
}
});

player.getNetworkingEngine().registerRequestFilter((type, request) => {
request.headers["Referer"] = "https://www.cricbuzz.com/";
request.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 10; SM-G973F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36";
});

function hideLoader() {
loader.classList.remove('active');
}
function showLoader() {
loader.classList.add('active');
}

video.addEventListener('waiting', showLoader);
video.addEventListener('stalled', showLoader);
video.addEventListener('loadstart', showLoader);
video.addEventListener('seeking', showLoader);

video.addEventListener('playing', hideLoader);
video.addEventListener('canplay', hideLoader);
video.addEventListener('canplaythrough', hideLoader);
video.addEventListener('timeupdate', function() {
if (!video.paused && video.currentTime > 0) {
hideLoader();
}
});

try {
await player.load(STREAM_URL);
} catch (error) {
hideLoader();
}

var _MODES = ["contain", "fill", "cover"];
var _ICONS = {
contain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg>',
fill:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
cover:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 7l3 3m0 0H7m2 0V8m9-1l-3 3m0 0h2m-2 0V8M6 13l3-3m0 0H7m2 0v2m9 1l-3-3m0 0h2m-2 0v2"/></svg>'
};

var _modeIdx = 0;

function injectFitButton(cnt, vid) {
var checkExist = setInterval(function () {
var panel = cnt.querySelector(".shaka-controls-button-panel");
if (panel) {
clearInterval(checkExist);
var btn = document.createElement("button");
btn.className = "shaka-fit-btn";
btn.innerHTML = _ICONS.contain;
var anchor = panel.querySelector(".shaka-fullscreen-button");
if (anchor) panel.insertBefore(btn, anchor);
else panel.appendChild(btn);

function applyMode(idx) {
_modeIdx = idx;
var m = _MODES[idx];
vid.classList.remove("mode-fill", "mode-cover");
if (m === "fill") vid.classList.add("mode-fill");
if (m === "cover") vid.classList.add("mode-cover");
btn.innerHTML = _ICONS[m];
}

btn.addEventListener("click", function (e) {
e.stopPropagation();
applyMode((_modeIdx + 1) % _MODES.length);
});

["fullscreenchange", "webkitfullscreenchange"].forEach(function (ev) {
document.addEventListener(ev, function () {
var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
if (!inFs) applyMode(0);
});
});
}
}, 50);
}

injectFitButton(container, video);

});
</script>
</body>
</html>
