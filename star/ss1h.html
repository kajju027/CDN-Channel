<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Star Sports </title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pc{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain;background:#000}
#wm{position:absolute;z-index:40;pointer-events:none;top:65%;left:6%;transform:translateY(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,0.12)}
@media(max-width:700px){#wm{font-size:9px;top:60%;left:16%}}
#overlay{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#overlay svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay p{color:#555;font-size:13px;letter-spacing:.5px}
#status{position:fixed;top:0;right:0;z-index:9997;padding:5px 10px;background:rgba(0,0,0,0.82);font-size:10px;letter-spacing:.04em;font-family:'Segoe UI',sans-serif;border-bottom-left-radius:6px;pointer-events:none;opacity:0;transition:opacity .4s ease;max-width:260px;text-align:right;line-height:1.5}
#status.show{opacity:1}
#status.ok{color:#4ade80}
#status.warn{color:#facc15}
#status.err{color:#f87171}
</style>
</head>
<body>
<div id="overlay">
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#222" stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <p>Loading stream...</p>
</div>
<div id="status"></div>
<div id="pc">
  <video id="v" autoplay muted playsinline preload="metadata"></video>
  <div id="wm"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";

var API_URL="https://sayan-json-2.pages.dev/Data/star_sports_1.json";
var CACHE_KEY="ss1_data";
var stEl=document.getElementById("status");
var stTimer=null;

/* === স্ট্যাটাস টোস্ট === */
function showStatus(msg,type,dur){
  stEl.textContent=msg;
  stEl.className="show "+(type||"ok");
  if(stTimer)clearTimeout(stTimer);
  if(dur!==0){
    stTimer=setTimeout(function(){
      stEl.className="";
      stTimer=null;
    },dur||4000);
  }
}

function hideOverlay(){
  var el=document.getElementById("overlay");
  if(el)el.style.display="none";
}
function getCookieExpiry(cookie){
  try{
    var raw=cookie.indexOf("__hdnea__=")===0?cookie.substring(10):cookie;
    var m=raw.match(/^exp=(\d+)/);
    if(m&&m[1])return parseInt(m[1],10)*1000-60000;
  }catch(e){}
  return 0;
}

/* === LST === */
function getCachedData(){
  try{
    var raw=localStorage.getItem(CACHE_KEY);
    if(!raw)return null;
    var data=JSON.parse(raw);
    if(data&&data.expiresAt&&Date.now()<data.expiresAt)return data;
    localStorage.removeItem(CACHE_KEY);
  }catch(e){
    try{localStorage.removeItem(CACHE_KEY);}catch(e2){}
  }
  return null;
}

function setCachedData(data){
  try{
    var exp=getCookieExpiry(data.cookie);
    var expiresAt=exp>0?exp:Date.now()+30*60*1000;
    localStorage.setItem(CACHE_KEY,JSON.stringify({
      cookie:data.cookie,
      key_id:data.key_id,
      key:data.key,
      stream_url:data.stream_url,
      expiresAt:expiresAt
    }));
  }catch(e){}
}
async function fetchChannelData(attempt){
  attempt=attempt||0;
  try{
    var res=await fetch(API_URL,{
      cache:"no-store",
      headers:{"Accept":"application/json"}
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    var data=await res.json();
    if(!data||!data.stream_url||!data.key_id||!data.key)throw new Error("Invalid data");
    setCachedData(data);
    return data;
  }catch(e){
    if(attempt<3){
      await new Promise(function(r){setTimeout(r,2000*(attempt+1));});
      return fetchChannelData(attempt+1);
    }
    throw e;
  }
}
async function init(){
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){
    showStatus("Browser not supported","err",0);
    hideOverlay();
    return;
  }
  var ch=getCachedData();
  var fromCache=!!ch;
  if(!ch){
    try{
      showStatus("Fetching stream data...","warn",0);
      ch=await fetchChannelData();
    }catch(e){
      showStatus("Network Error","err",0);
      hideOverlay();
      return;
    }
  }

  var vid=document.getElementById("v");
  var con=document.getElementById("pc");
  vid.muted=true;

  var player=new shaka.Player();
  await player.attach(vid);

  var ui=new shaka.ui.Overlay(player,con,vid);
  ui.configure({
    controlPanelElements:["play_pause","spacer","quality","picture_in_picture","fullscreen"],
    seekBarColors:{base:"#9c9a9a",buffered:"#c90000",played:"#00ab17"}
  });
  var activeCookie=ch.cookie;
  var activeKeyId=ch.key_id;
  var activeKey=ch.key;
  var activeUrl=ch.stream_url;

  function applyPlayerConfig(){
    player.configure({
      drm:{clearKeys:{}},
      streaming:{
        bufferingGoal:15,
        rebufferingGoal:3,
        retryParameters:{maxAttempts:5,baseDelay:1000,backoffFactor:2,fuzzFactor:0.5}
      }
    });
    player.configure({drm:{clearKeys:{}}});
    player.getConfiguration().drm.clearKeys[activeKeyId]=activeKey;
  }

  applyPlayerConfig();
  var RT=shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type,req){
    if(type!==RT.MANIFEST&&type!==RT.SEGMENT)return;
    req.headers["Referer"]="https://www.jiotv.com/";
    req.headers["User-Agent"]="plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
    req.headers["Cookie"]=activeCookie;
  });

  var isRefreshing=false;

  async function refreshAndReload(attempt){
    if(isRefreshing)return;
    isRefreshing=true;
    showStatus("Reconnecting...","warn",0);
    try{
      var fresh=await fetchChannelData(attempt||0);
      activeCookie=fresh.cookie;
      activeKeyId=fresh.key_id;
      activeKey=fresh.key;
      activeUrl=fresh.stream_url;
      applyPlayerConfig();
      await player.load(activeUrl);
      vid.play().catch(function(){});
      showStatus("Live \u25CF","ok",5000);
    }catch(e){
      var a=attempt||0;
      if(a<3){
        showStatus("Retrying... ("+(a+1)+"/3)","warn",0);
        isRefreshing=false;
        setTimeout(function(){refreshAndReload(a+1);},3000);
        return;
      }
      showStatus("Stream interrupted","err",0);
    }
    setTimeout(function(){isRefreshing=false;},2000);
  }

  player.addEventListener("error",function(ev){
    var code=ev.detail&&ev.detail.code;
    if([1001,1002,7000,7001,7002].includes(code)){
      refreshAndReload();
    }
  });
  try{
    await player.load(activeUrl);
    vid.play().catch(function(){});
    hideOverlay();
    showStatus("Live \u25CF","ok",fromCache?3000:5000);
  }catch(e){
    hideOverlay();

    if(fromCache){
      showStatus("Cache expired, refreshing...","warn",0);
      try{localStorage.removeItem(CACHE_KEY);}catch(e2){}
      try{
        var fresh=await fetchChannelData();
        activeCookie=fresh.cookie;
        activeKeyId=fresh.key_id;
        activeKey=fresh.key;
        activeUrl=fresh.stream_url;
        applyPlayerConfig();
        await player.load(activeUrl);
        vid.play().catch(function(){});
        showStatus("Live \u25CF","ok",5000);
      }catch(e2){
        showStatus("Playback failed","err",0);
      }
    }else{
      showStatus("Playback failed","err",0);
    }
    return;
  }
  vid.addEventListener("play",function(){vid.muted=false;});
  var stallTimer=null;
  function onBuffering(){
    if(stallTimer)return;
    showStatus("Buffering...","warn",0);
    stallTimer=setTimeout(function(){
      stallTimer=null;
      refreshAndReload();
    },10000);
  }

  vid.addEventListener("waiting",onBuffering);

  vid.addEventListener("playing",function(){
    if(stallTimer){
      clearTimeout(stallTimer);
      stallTimer=null;
    }
    showStatus("Live \u25CF","ok",4000);
  });
}

init();
})();
</script>
</body>
</html>
