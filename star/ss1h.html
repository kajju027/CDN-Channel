<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Star Sports 1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.11.2/dist/controls.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  /* Player container */
  #pc {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }

  video {
    width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }

  /* Loading overlay */
  #overlay {
    position: fixed; inset: 0;
    background: #000; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }

  #overlay svg { animation: spin 1s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  #overlay p {
    color: #666; font-size: 13px; letter-spacing: .5px;
  }

  /* Status toast - top right */
  #status {
    position: fixed; top: 0; right: 0;
    z-index: 9997;
    padding: 6px 12px;
    background: rgba(0,0,0,0.85);
    font-size: 11px; letter-spacing: .04em;
    border-bottom-left-radius: 7px;
    pointer-events: none;
    opacity: 0; transition: opacity .4s ease;
    max-width: 280px; text-align: right; line-height: 1.6;
  }

  #status.show  { opacity: 1; }
  #status.ok    { color: #4ade80; }
  #status.warn  { color: #facc15; }
  #status.err   { color: #f87171; }
</style>
</head>
<body>

<!-- Loading screen -->
<div id="overlay">
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#222" stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <p id="loadMsg">Loading stream...</p>
</div>

<!-- Status toast -->
<div id="status"></div>

<!-- Player wrapper -->
<div id="pc">
  <video id="v" autoplay muted playsinline preload="metadata"></video>
</div>

<!-- Pinned Shaka version for stability -->
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.2/dist/shaka-player.ui.min.js"></script>

<script>
(function () {
  "use strict";

  /* ─── API endpoint ─────────────────────────────────────────────── */
  var API_URL = "https://sayan-json-2.pages.dev/Data/star_sports_1.json";

  /* ─── DOM refs ─────────────────────────────────────────────────── */
  var stEl      = document.getElementById("status");
  var loadMsg   = document.getElementById("loadMsg");
  var overlay   = document.getElementById("overlay");
  var vid       = document.getElementById("v");
  var container = document.getElementById("pc");

  var stTimer   = null;
  var isRefreshing = false;
  var stallTimer   = null;

  /* ─── Status toast helper ──────────────────────────────────────── */
  function showStatus(msg, type, dur) {
    stEl.textContent = msg;
    stEl.className   = "show " + (type || "ok");
    if (stTimer) clearTimeout(stTimer);
    if (dur !== 0) {
      stTimer = setTimeout(function () {
        stEl.className = "";
        stTimer = null;
      }, dur || 4000);
    }
  }

  function hideOverlay() {
    if (overlay) overlay.style.display = "none";
  }

  function setLoadMsg(msg) {
    if (loadMsg) loadMsg.textContent = msg;
  }

  /* ─── Fetch fresh channel data (no cache, always live) ─────────── */
  async function fetchChannelData(attempt) {
    attempt = attempt || 0;
    try {
      var res = await fetch(API_URL, {
        cache:   "no-store",
        headers: { "Accept": "application/json" }
      });
      if (!res.ok) throw new Error("HTTP " + res.status + " from API");

      var data = await res.json();

      /* Validate required fields */
      if (!data || !data.stream_url) throw new Error("Missing stream_url in response");
      if (!data.key_id)              throw new Error("Missing key_id in response");
      if (!data.key)                 throw new Error("Missing key in response");
      if (!data.cookie)              throw new Error("Missing cookie in response");

      return data;
    } catch (e) {
      if (attempt < 3) {
        /* Exponential back-off: 2s, 4s, 6s */
        var delay = 2000 * (attempt + 1);
        showStatus("API retry " + (attempt + 1) + "/3 — " + e.message, "warn", 0);
        await new Promise(function (r) { setTimeout(r, delay); });
        return fetchChannelData(attempt + 1);
      }
      throw new Error("API failed after 3 retries: " + e.message);
    }
  }

  /* ─── Build correct clearKeys config object ────────────────────── */
  /*
   * BUG FIX:
   * The old code did:
   *   player.configure({drm:{clearKeys:{}}});
   *   player.getConfiguration().drm.clearKeys[keyId] = key;   // WRONG
   *
   * getConfiguration() returns a DEEP COPY, not a reference.
   * Mutating it has zero effect on the player — clearKeys stayed empty
   * and DRM decryption never worked.
   *
   * Fix: build the object first, then pass it in one configure() call.
   */
  function buildDrmConfig(keyId, key) {
    var clearKeys = {};
    clearKeys[keyId] = key;
    return {
      drm: {
        clearKeys: clearKeys
      }
    };
  }

  /* ─── Main init ─────────────────────────────────────────────────── */
  async function init() {
    /* Install polyfills for older / mobile browsers */
    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
      showStatus("Browser not supported — try Chrome or Firefox", "err", 0);
      setLoadMsg("Browser not supported.");
      return;
    }

    /* Always fetch fresh — no localStorage */
    var ch;
    try {
      setLoadMsg("Fetching stream data...");
      showStatus("Fetching stream data...", "warn", 0);
      ch = await fetchChannelData();
    } catch (e) {
      showStatus("Network Error: " + e.message, "err", 0);
      setLoadMsg("Network error. Please refresh.");
      return;
    }

    /* Create Shaka player and attach to video element */
    var player = new shaka.Player();
    await player.attach(vid);

    /* Shaka UI — minimal controls */
    var ui = new shaka.ui.Overlay(player, container, vid);
    ui.configure({
      controlPanelElements: [
        "play_pause", "spacer", "quality", "picture_in_picture", "fullscreen"
      ],
      seekBarColors: {
        base:     "#9c9a9a",
        buffered: "#c90000",
        played:   "#00ab17"
      }
    });

    /* Active stream credentials (updated on refresh) */
    var activeCookie = ch.cookie;
    var activeKeyId  = ch.key_id;
    var activeKey    = ch.key;
    var activeUrl    = ch.stream_url;

    /* Apply player config with correct DRM clearKeys */
    function applyConfig() {
      var drmCfg = buildDrmConfig(activeKeyId, activeKey);
      player.configure(Object.assign(drmCfg, {
        streaming: {
          bufferingGoal:   15,
          rebufferingGoal: 3,
          retryParameters: {
            maxAttempts:   5,
            baseDelay:     1000,
            backoffFactor: 2,
            fuzzFactor:    0.5
          }
        }
      }));
    }

    applyConfig();

    /* Inject required JioTV headers on every manifest / segment request */
    var RT = shaka.net.NetworkingEngine.RequestType;
    player.getNetworkingEngine().registerRequestFilter(function (type, req) {
      if (type !== RT.MANIFEST && type !== RT.SEGMENT) return;
      req.headers["Referer"]    = "https://www.jiotv.com/";
      req.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
      req.headers["Cookie"]     = activeCookie;
    });

    /* ── Refresh + reload when stream breaks ─────────────────────── */
    async function refreshAndReload(reason, attempt) {
      if (isRefreshing) return;
      isRefreshing = true;
      attempt = attempt || 0;
      showStatus("Reconnecting — " + (reason || "stream error"), "warn", 0);

      try {
        var fresh = await fetchChannelData();
        activeCookie = fresh.cookie;
        activeKeyId  = fresh.key_id;
        activeKey    = fresh.key;
        activeUrl    = fresh.stream_url;
        applyConfig();
        await player.load(activeUrl);
        vid.play().catch(function () {});
        showStatus("Live \u25CF", "ok", 5000);
      } catch (e) {
        if (attempt < 3) {
          showStatus("Retry " + (attempt + 1) + "/3 — " + e.message, "warn", 0);
          isRefreshing = false;
          setTimeout(function () { refreshAndReload(reason, attempt + 1); }, 3000);
          return;
        }
        showStatus("Stream unavailable: " + e.message, "err", 0);
      }

      setTimeout(function () { isRefreshing = false; }, 2000);
    }

    /* Shaka error codes that require a full stream refresh */
    var REFRESH_CODES = [1001, 1002, 7000, 7001, 7002, 6006, 6007];

    player.addEventListener("error", function (ev) {
      var code    = ev.detail && ev.detail.code;
      var message = ev.detail && ev.detail.message;
      if (REFRESH_CODES.includes(code)) {
        refreshAndReload("Shaka error " + code);
      } else {
        showStatus("Player error " + code + (message ? ": " + message : ""), "err", 5000);
      }
    });

    /* ── Initial load ────────────────────────────────────────────── */
    try {
      setLoadMsg("Starting playback...");
      await player.load(activeUrl);
      vid.play().catch(function () {});
      hideOverlay();
      showStatus("Live \u25CF", "ok", 5000);
    } catch (e) {
      hideOverlay();
      showStatus("Playback failed: " + (e.message || e), "err", 0);
      return;
    }

    /* Unmute after first user interaction / autoplay */
    vid.addEventListener("play", function () {
      vid.muted = false;
    }, { once: true });

    /* ── Stall / buffering watchdog ──────────────────────────────── */
    vid.addEventListener("waiting", function () {
      if (stallTimer) return;
      showStatus("Buffering — please wait...", "warn", 0);
      stallTimer = setTimeout(function () {
        stallTimer = null;
        refreshAndReload("stall timeout");
      }, 10000);
    });

    vid.addEventListener("playing", function () {
      if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
      showStatus("Live \u25CF", "ok", 4000);
    });

    /* ── Visibility change: reload when tab becomes active again ─── */
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && vid.paused) {
        vid.play().catch(function () { refreshAndReload("tab resumed"); });
      }
    });

  } /* end init */

  init();

})();
</script>
</body>
</html>
