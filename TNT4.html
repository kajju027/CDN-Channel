<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>
  <meta name="referrer" content="no-referrer">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #watermark {
      position: absolute;
      top: 60%;
      left: 15px;
      color: rgba(255, 255, 255, 0.12); 
      font-size: 0.6em; 
      pointer-events: none;
      z-index: 10;
      letter-spacing: 0.5px;
    }
    #initial-loading-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    #normal-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      display: none;
    }
    .big-spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #0055ff;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .small-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: #ffff00;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      color: #fff;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .youtube-theme .shaka-seek-bar-container { height: 4px; }
    .youtube-theme .shaka-played-range { background: #ffff00 !important; }
    .youtube-theme .shaka-buffered-range { background: rgba(255, 255, 0, 0.2) !important; }
    .youtube-theme .shaka-volume-bar-container, .shaka-spinner-container { display: none !important; }
    .shaka-controls-button-panel { height: 50px; padding: 0 10px; }
  </style>
</head>
<body>

<div class="shaka-video-container youtube-theme" id="container">
  <video id="video" autoplay muted playsinline poster=" "></video>
  <div id="watermark">@SAYAN_XYZ</div>
  <div id="initial-loading-overlay">
    <div class="big-spinner"></div>
    <div class="loading-text">CONNECTING...</div>
  </div>
  <div id="normal-loader">
    <div class="small-spinner"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  shaka.polyfill.installAll();

  const STREAM_URL = "lhttps://ottb.live.cf.ww.aiv-cdn.net/lhr-nitro/live/dash/enc/i2pcjr4pe5/out/v1/912e9db56d75403b8a9ac0a719110f36/cenc.mpd"; 
  const KEY_ID = "192b1115da041585c77200128549efa1"; 
  const KEY = "634e10efe4abbb14be400a3ccbac0258";
  const POSTER_URL = " ";
  const STORAGE_KEY = 'SAYAN_PLAYER_UNMUTED_PERMANENT';

  const video = document.getElementById('video');
  const container = document.getElementById('container');
  const initialOverlay = document.getElementById('initial-loading-overlay');
  const normalLoader = document.getElementById('normal-loader');

  video.poster = POSTER_URL;
  let hasVideoStarted = false;

  const player = new shaka.Player();
  await player.attach(video);
  const ui = new shaka.ui.Overlay(player, container, video);
  
  ui.configure({
    'seekBarColors': { base: 'rgba(255,255,255,0.2)', buffered: 'rgba(255,255,0,0.2)', played: '#ffff00' },
    'controlPanelElements': ['play_pause', 'time_and_duration', 'mute', 'spacer', 'quality', 'picture_in_picture', 'fullscreen']
  });

  player.configure({  
    drm: { clearKeys: { [KEY_ID]: KEY } },
    abr: { enabled: false },
    streaming: { bufferingGoal: 30, rebufferingGoal: 10 }
  });

  player.addEventListener('buffering', (e) => {
    if (!hasVideoStarted) {
      initialOverlay.style.display = e.buffering ? 'flex' : 'none';
    } else {
      normalLoader.style.display = e.buffering ? 'block' : 'none';
      initialOverlay.style.display = 'none';
    }
  });

  video.addEventListener('playing', () => {
    hasVideoStarted = true;
    initialOverlay.style.display = 'none';
    normalLoader.style.display = 'none';
  });

  const handleUnmute = () => {
    if (video.muted) {
      video.muted = false;
      localStorage.setItem(STORAGE_KEY, 'true');
    }
  };

  container.addEventListener('click', handleUnmute);
  video.addEventListener('volumechange', () => {
    localStorage.setItem(STORAGE_KEY, (!video.muted).toString());
  });

  try {
    await player.load(STREAM_URL);
    const tracks = player.getVariantTracks();
    const track240p = tracks.find(t => t.height === 396) || tracks.sort((a,b) => a.height - b.height)[0];
    if (track396p) player.selectVariantTrack(track396p, true);

    if (localStorage.getItem(STORAGE_KEY) === 'true') {
      video.play().then(() => {
        video.muted = false;
      }).catch(() => {
        video.muted = true;
        video.play();
      });
    } else {
      video.play();
    }
  } catch (e) {
    initialOverlay.style.display = 'none';
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "TNT SPORTS BY CRICKET NEWS POINT",
      artist: '@SAYAN_XYZ',
      artwork: [{ src: POSTER_URL, sizes: '512x512', type: 'image/png' }]
    });
  }
});
</script>
</body>
</html>
