<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Fast Player</title>

  <script src="https://cdn.jsdelivr.net/npm/shaka-player/dist/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player/dist/controls.css" />

  <style>
    /* --- RESET & LAYOUT --- */
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    
    .shaka-video-container { 
      width: 100%; 
      height: 100%; 
      background: #000; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }

    /* Video starts in 'contain' mode */
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      transition: object-fit 0.3s ease; 
    }

    /* --- UI CUSTOMIZATION --- */
    
    /* 1. Small & Stylish Play Button (Shokhini Style) */
    .shaka-play-button-container {
      background: rgba(255, 255, 255, 0.15) !important;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 50% !important;
      width: 60px !important;  /* Smaller size */
      height: 60px !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .shaka-play-button-container:hover {
      background: rgba(255, 0, 0, 0.8) !important;
      border-color: red;
    }
    .shaka-play-button {
      font-size: 20px !important; /* Smaller icon */
      padding: 0 !important;
    }

    /* 2. Premium Seeker Bar */
    .shaka-seek-bar-container {
      height: 5px !important;
      border-radius: 2px;
      margin-bottom: 5px;
    }

    /* 3. Watermark */
    .custom-watermark {
      position: absolute;
      top: 20px; right: 25px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.3);
      z-index: 10;
      pointer-events: none;
      font-family: sans-serif;
    }

    /* Hide unnecessary elements */
    .shaka-volume-bar-container { display: none !important; } 
    .shaka-spinner-container { display: none !important; }
    .shaka-overflow-menu-button { display: none !important; } /* Clean look */
  </style>
</head>

<body>

<div class="shaka-video-container" id="player-container">
  <video id="video" autoplay playsinline></video>
  <div class="custom-watermark">Sayan Official ™</div>
</div>

<script>
const manifestUrl = "https://a166aivottlinear-a.akamaihd.net/OTTB/bom-nitro/live/dash/enc/igjuwt107o/out/v1/489e489428ce4992b9bd784d6b948ab3/cenc.mpd";
const keyId = "2904b17cb64c996dbc254981b7602863";
const key = "66a7ef671b84498e64f94e8401fe8cb9";

// --- FULLSCREEN LOGIC (Auto Fill) ---
document.addEventListener('fullscreenchange', () => {
  const video = document.getElementById('video');
  if (document.fullscreenElement) {
    // Fullscreen active -> Stretch/Fill the screen
    video.style.objectFit = 'fill'; 
  } else {
    // Fullscreen exit -> Normal aspect ratio
    video.style.objectFit = 'contain';
  }
});

document.addEventListener('DOMContentLoaded', async () => {
  // Install Polyfills
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) return;

  const video = document.getElementById('video');
  const container = document.getElementById('player-container');
  
  const player = new shaka.Player(video);
  const ui = new shaka.ui.Overlay(player, container, video);

  // 1. UI Config (Minimal & Premium)
  ui.configure({
    controlPanelElements: [
      'play_pause',
      'time_and_duration',
      'spacer',
      'quality',
      'fullscreen'
    ],
    seekBarColors: {
      base: 'rgba(255, 255, 255, 0.3)',
      buffered: 'red',
      played: '#FFFFFF' // Premium White
    }
  });

  // 2. Player Config (Speed & Stability)
  player.configure({
    drm: { clearKeys: { [keyId]: key } },
    streaming: {
      lowLatencyMode: true,
      bufferingGoal: 5,        // Increased slightly for stability
      rebufferingGoal: 1,
      jumpLargeGaps: true,
      ignoreDeviceMaxResolution: true
    }
  });

  // 3. Load & Play
  try {
    await player.load(manifestUrl);
    // Logic: Start 4s behind live edge once, then let it run naturally.
    // We removed the 'setInterval' loop so it won't stop every 5s.
    if (player.isLive()) {
      video.currentTime = player.seekRange().end - 4;
    }
    console.log('Video loaded and playing smoothly');
  } catch (e) {
    console.error('Error:', e);
  }
});
</script>

</body>
</html>
