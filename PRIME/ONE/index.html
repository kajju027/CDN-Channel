<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prime TV • Sayan 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
    .shaka-video-container{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .shaka-volume-bar-container,.shaka-spinner-container{display:none!important}
    .custom-watermark{position:absolute;z-index:40;pointer-events:none;top:65%;left:6%;transform:translateY(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,0.12)}
    @media(max-width:700px){.custom-watermark{font-size:9px;top:60%;left:16%}}
  </style>
</head>
<body>
  <div class="shaka-video-container" id="player-container">
    <video id="video" autoplay playsinline></video>
    <div class="custom-watermark">‎  ‎ ‎ ‎ ‎ Sayan Official ™</div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const videoEl = document.getElementById('video');
      const container = document.getElementById('player-container');

      const streamUrl = "https://otte.cache.aiv-cdn.net/syd-nitro/live/dash/enc/pnu10tp36z/out/v1/912e9db56d75403b8a9ac0a719110f36/cenc.mpd?";
      const keyId = "634e10efe4abbb14be400a3ccbac0258";
      const key = "192b1115da041585c77200128549efa1";

      const player = new shaka.Player();
      await player.attach(videoEl);
      const ui = new shaka.ui.Overlay(player, container, videoEl);

      ui.configure({
        controlPanelElements: ['play_pause','time_and_duration','spacer','language','captions','picture_in_picture','quality','fullscreen'],
        seekBarColors: {
          base: 'white',
          buffered: 'red',
          played: 'green'
        }
      });

      player.configure({
        drm: {
          clearKeys: {
            [keyId]: key
          }
        },
        abr: {
          defaultBandwidthEstimate: 10000,
          enabled: true,
          switchInterval: 1
        },
        manifest: {
          defaultPresentationDelay: 4,
          dash: {
            ignoreSuggestedPresentationDelay: true,
            ignoreMinBufferTime: true,
            autoCorrectDrift: true
          }
        },
        streaming: {
          bufferingGoal: 8,
          rebufferingGoal: 2,
          bufferBehind: 10,
          lowLatencyMode: true,
          safeSeekOffset: 4,
          stallThreshold: 1,
          jumpLargeGaps: true
        }
      });

      try {
        await player.load(streamUrl, -4);
        videoEl.play();
      } catch (e) {
      }
    });
  </script>
</body>
</html>
