<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Ultra Fast Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css" crossorigin="anonymous">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}

.shaka-video-container{
  position:fixed;
  inset:0;
  background:#000;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

/* কালো ফিল্টার বা আফজাল ছাপ দূর করা */
.shaka-scrim-container, .shaka-scrim-vertical {
  display: none !important; /* ভিডিওর ওপরের কালো শ্যাডো পুরোপুরি রিমুভ */
}

.shaka-controls-container {
  background: transparent !important; /* কন্ট্রোলারের ব্যাকগ্রাউন্ড ট্রান্সপারেন্ট */
}

/* কাস্টম থাম্বনেইল পোস্টার */
#custom-poster {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000;
  background-image: url('https://elamplificador.com/wp-content/uploads/2023/08/trucos-amazon-primevideo-ksrD-620x349@abc.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  z-index: 5;
  cursor: pointer;
}

/* ডিফল্ট বড় প্লে বাটনকে পোস্টারের ওপরে আনা */
.shaka-unveiling-controls-panel .shaka-big-play-button {
  z-index: 11 !important;
}

/* প্রিমিয়াম হোয়াইট সিকার বার */
.shaka-seek-bar-container{
  padding:0 !important;
  margin:0 0 10px 0 !important;
  width:100% !important;
}
.shaka-seek-bar .shaka-progress-bar{ background: #ffffff !important; }
.shaka-seek-bar .shaka-buffer-bar{ background: rgba(255, 255, 255, 0.4) !important; }
.shaka-seek-bar .shaka-base-bar{ background: rgba(255, 255, 255, 0.15) !important; }

/* জুম বাটন */
.shaka-zoom-button {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0 5px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.shaka-zoom-button svg { width: 24px; height: 24px; fill: white; }

/* ক্যাপশন অফ */
.shaka-caption-button, .shaka-text-container { display: none !important; }

.shaka-spinner-container { display: none !important; }
</style>
</head>

<body>

<div class="shaka-video-container" id="player-container">
  <div id="custom-poster"></div>
  
  <video id="video" autoplay playsinline muted></video>
</div>

<script>
// জুম বাটন ক্লাস
class ZoomButton extends shaka.ui.Element {
  constructor(parent, controls) {
    super(parent, controls);
    this.button_ = document.createElement('button');
    this.button_.classList.add('shaka-zoom-button');
    this.button_.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';
    parent.appendChild(this.button_);

    this.eventManager.listen(this.button_, 'click', () => {
      const video = this.controls.getVideo();
      const currentFit = video.style.objectFit || 'contain';
      if (currentFit === 'contain') video.style.objectFit = 'cover';
      else if (currentFit === 'cover') video.style.objectFit = 'fill';
      else video.style.objectFit = 'contain';
    });
  }
}
ZoomButton.Factory = class { create(rootElement, controls) { return new ZoomButton(rootElement, controls); } };

document.addEventListener('DOMContentLoaded', async function () {
  shaka.polyfill.installAll();
  
  shaka.ui.Controls.registerElement('zoom', new ZoomButton.Factory());

  const video = document.getElementById('video');
  const container = document.getElementById('player-container');
  const poster = document.getElementById('custom-poster');

  const streamUrl = "https://live-pv-ta.amazon.fastly-edge.com/syd-nitro/live/clients/dash/enc/wwrmho82pc/out/v1/d7130f460d41486ea7e8e3eb45f0522f/cenc.mpd";
  const keyId = "baafdb8ebcbbc0655332291da6f121da";
  const key = "60ac892e0ea0b2c46fc6837c97ed641a";

  const player = new shaka.Player();
  await player.attach(video);

  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: ['play_pause', 'mute', 'time_and_duration', 'spacer', 'zoom', 'picture_in_picture', 'quality', 'fullscreen'],
    addBigPlayButton: true, // ডিফল্ট শাকা প্লে বাটন অন রাখা হলো
    seekBarColors: { base: 'rgba(255, 255, 255, 0.15)', buffered: 'rgba(255, 255, 255, 0.4)', played: '#ffffff' }
  });

  // দ্রুত প্লে হওয়ার জন্য কনফিগারেশন (Low Latency)
  player.configure({
    drm: { clearKeys: { [keyId]: key } },
    streaming: {
      lowLatencyMode: true,
      autoLowLatencyMode: true,
      bufferingGoal: 2, // মাত্র ২ সেকেন্ড বাফার করবে দ্রুত শুরুর জন্য
      rebufferingGoal: 1,
      bufferBehind: 0,
      infiniteBuffer: false
    },
    abr: { enabled: true }
  });

  player.setTextTrackVisibility(false);

  try {
    // '-1' বা '0' দিলে ভিডিও লাইভ এজের একদম শেষ থেকে শুরু হবে, কোনো ডিলে থাকবে না
    await player.load(streamUrl, 0);

    // ক্লিক ইভেন্ট: প্লেয়ারের যেকোনো জায়গায় বা পোস্টারে ক্লিক করলে আনমিউট হবে
    const startPlayer = () => {
      video.muted = false;
      video.play();
      poster.style.display = 'none';
    };

    poster.addEventListener('click', startPlayer);
    
    // ভিডিও প্লে হতে শুরু করলে অটোমেটিক পোস্টার রিমুভ করার ব্যাকআপ
    video.addEventListener('playing', () => {
       poster.style.display = 'none';
    });

  } catch (e) {
    console.error(e);
  }
});
</script>

</body>
</html>
