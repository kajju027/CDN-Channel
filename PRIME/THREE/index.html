<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Dillzy By Prime //  Amazon Prime</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css" crossorigin="anonymous">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}

.shaka-video-container{
  position:fixed;
  inset:0;
  background:#000;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.shaka-scrim-container,
.shaka-scrim-vertical {
  display:none !important;
}

.shaka-controls-container {
  background:linear-gradient(to top,rgba(0,0,0,0.7),transparent) !important;
  opacity:1 !important;
  display:flex !important;
  z-index:20 !important;
}

.shaka-settings-menu,
.shaka-overflow-menu {
  bottom:60px !important;
  top:auto !important;
  z-index:9999 !important;
}

#custom-poster {
  position:absolute;
  inset:0;
  background:#000 url('https://elamplificador.com/wp-content/uploads/2023/08/trucos-amazon-primevideo-ksrD-620x349@abc.png') center/contain no-repeat;
  z-index:5;
  cursor:pointer;
}

.shaka-big-play-button {
  background-color:rgba(255,255,255,0.15) !important;
  backdrop-filter:blur(8px);
  width:80px !important;
  height:80px !important;
  border-radius:50% !important;
  z-index:30 !important;
}

.shaka-seek-bar-container {
  padding:0 !important;
  margin:0 0 10px 0 !important;
  width:100% !important;
}

.shaka-seek-bar {
  width:100% !important;
  height:4px !important;
}

.shaka-seek-bar .shaka-progress-bar {background:#ffffff !important;}
.shaka-seek-bar .shaka-buffer-bar {background:rgba(255,255,255,0.4) !important;}
.shaka-seek-bar .shaka-base-bar {background:rgba(255,255,255,0.2) !important;}

.shaka-spinner-container,
.shaka-caption-button,
.shaka-text-container {
  display:none !important;
}
</style>
</head>

<body>

<div class="shaka-video-container" id="player-container">
  <div id="custom-poster"></div>
  <video id="video" playsinline></video>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) return;

  const video = document.getElementById('video');
  const container = document.getElementById('player-container');
  const poster = document.getElementById('custom-poster');

  const streamUrl = "https://live-pv-ta.amazon.fastly-edge.com/syd-nitro/live/clients/dash/enc/wwrmho82pc/out/v1/d7130f460d41486ea7e8e3eb45f0522f/cenc.mpd";
  const keyId = "baafdb8ebcbbc0655332291da6f121da";
  const key = "60ac892e0ea0b2c46fc6837c97ed641a";

  const player = new shaka.Player(video);

  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      'mute',
      'time_and_duration',
      'spacer',
      'quality',
      'fullscreen',
      'overflow_menu'
    ],
    overflowMenuButtons: ['picture_in_picture','captions'],
    addBigPlayButton: true
  });

  player.configure({
    drm: {
      clearKeys: {
        [keyId]: key
      }
    },
    streaming: {
      lowLatencyMode:true,
      bufferingGoal:2,
      rebufferingGoal:1,
      bufferBehind:5
    }
  });

  player.setTextTrackVisibility(false);

  try {
    await player.load(streamUrl);

    const startPlayback = async () => {
      poster.style.display = "none";
      await video.play();
    };

    poster.addEventListener('click', startPlayback);

    video.addEventListener('playing', () => {
      poster.style.display = "none";
    });

  } catch (e) {
    console.error("Player error:", e);
  }

});
</script>

</body>
</html>
